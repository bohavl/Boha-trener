<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Журнал тренувань</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --surface: #16171a;
    --border: #2a2b30;
    --text: #e7e7ea;
    --text-dim: #8b8c92;
    --accent: #4F46E5;
    --danger: #f43f5e;
    --success: #10b981;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  input { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
  button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
  ::placeholder { color: #55565c; }
  .oswald { font-family: 'Oswald', sans-serif; }
  .tabular { font-variant-numeric: tabular-nums; }
  .wrap { padding: 18px 16px; max-width: 560px; margin: 0 auto; }
  .card { border: 1px solid var(--border); border-radius: 6px; }
  .dim { color: var(--text-dim); }
  .row { display: flex; align-items: center; }
  .icon-btn { padding: 6px; border-radius: 4px; font-size: 14px; line-height: 1; color: var(--text-dim); }
  .icon-btn.danger { color: var(--danger); }
  .icon-btn.accent { color: var(--accent); }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); padding: 10px 12px; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .tab-btn.active { border-bottom-color: var(--accent); color: var(--text); }
</style>
</head>
<body>
<div id="app"><div class="wrap dim" style="font-size:14px;">Завантаження…</div></div>
<script>
(function () {
  "use strict";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  var useCloud = !!(tg && tg.CloudStorage);

  // ---------- storage abstraction ----------
  function csGetItems(keys) {
    return new Promise(function (resolve) {
      if (useCloud) {
        tg.CloudStorage.getItems(keys, function (err, values) { resolve(err ? {} : (values || {})); });
      } else {
        var out = {};
        keys.forEach(function (k) { var v = localStorage.getItem(k); if (v !== null) out[k] = v; });
        resolve(out);
      }
    });
  }
  function csSet(key, value) {
    return new Promise(function (resolve) {
      if (useCloud) { tg.CloudStorage.setItem(key, value, function () { resolve(); }); }
      else { localStorage.setItem(key, value); resolve(); }
    });
  }
  function csRemove(key) {
    return new Promise(function (resolve) {
      if (useCloud) { tg.CloudStorage.removeItem(key, function () { resolve(); }); }
      else { localStorage.removeItem(key); resolve(); }
    });
  }

  // ---------- helpers ----------
  function uid() { return Date.now() + "-" + Math.random().toString(36).slice(2, 9); }
  function todayISO() { return new Date().toISOString(); }
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString("uk-UA", { day: "2-digit", month: "short", year: "numeric" });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function sessionVolume(session) {
    return session.exercises.reduce(function (sum, ex) {
      return sum + ex.sets.reduce(function (s, set) {
        var w = parseFloat(set.weight) || 0, r = parseFloat(set.reps) || 0;
        return s + w * r;
      }, 0);
    }, 0);
  }
  function defaultDay(n) { return { id: uid(), name: "День " + n, exercises: [] }; }
  function defaultExercise() { return { id: uid(), name: "", targetSets: 3, targetReps: "8-10", targetWeight: "" }; }

  // ---------- data layer (chunked to respect Telegram's 4096-char value limit) ----------
  function loadAll() {
    return csGetItems(["days_index", "log_index", "active_session"]).then(function (idx) {
      var dayIds = idx.days_index ? JSON.parse(idx.days_index) : [];
      var logIds = idx.log_index ? JSON.parse(idx.log_index) : [];
      var dayKeys = dayIds.map(function (id) { return "day:" + id; });
      var logKeys = logIds.map(function (id) { return "log:" + id; });
      return Promise.all([
        dayKeys.length ? csGetItems(dayKeys) : Promise.resolve({}),
        logKeys.length ? csGetItems(logKeys) : Promise.resolve({})
      ]).then(function (results) {
        var dayVals = results[0], logVals = results[1];
        var plan = dayIds.map(function (id) { return dayVals["day:" + id] ? JSON.parse(dayVals["day:" + id]) : null; }).filter(Boolean);
        var logs = logIds.map(function (id) { return logVals["log:" + id] ? JSON.parse(logVals["log:" + id]) : null; }).filter(Boolean);
        var activeSession = null;
        if (idx.active_session) { try { activeSession = JSON.parse(idx.active_session); } catch (e) {} }
        return { plan: plan, logs: logs, activeSession: activeSession };
      });
    });
  }
  function saveDaysIndex(plan) { return csSet("days_index", JSON.stringify(plan.map(function (d) { return d.id; }))); }
  function saveDay(day) { return csSet("day:" + day.id, JSON.stringify(day)); }
  function deleteDay(id) { return csRemove("day:" + id); }
  function saveLogsIndex(logs) { return csSet("log_index", JSON.stringify(logs.map(function (l) { return l.id; }))); }
  function saveLog(session) { return csSet("log:" + session.id, JSON.stringify(session)); }
  function deleteLogEntry(id) { return csRemove("log:" + id); }
  function persistSession(s) { return csSet("active_session", JSON.stringify(s || null)); }

  // ---------- state ----------
  var S = { tab: "plan", plan: [], logs: [], activeSession: null, openDayId: null, openLogId: null, note: "" };
  var dayTimers = {};
  var sessionTimer = null;

  var root = document.getElementById("app");

  // ================= RENDER =================
  function render() {
    var html = "";
    html += '<div style="border-bottom:1px solid var(--border);padding:18px 16px 0;">';
    html += '<div class="row" style="gap:8px;margin-bottom:14px;"><span style="font-size:20px;">🏋️</span>';
    html += '<h1 class="oswald" style="font-size:19px;font-weight:600;margin:0;">Журнал тренувань</h1></div>';
    html += '<div class="row" style="gap:2px;overflow-x:auto;margin-bottom:-1px;">';
    ["plan", "train", "progress"].forEach(function (t) {
      var label = t === "plan" ? "Мій план" : t === "train" ? ("Тренування" + (S.activeSession ? " •" : "")) : "Прогрес";
      html += '<button class="tab-btn' + (S.tab === t ? ' active' : '') + '" onclick="App.setTab(\'' + t + '\')">' + label + '</button>';
    });
    html += '</div></div>';
    html += '<div class="wrap">';
    if (S.note) html += '<div style="margin-bottom:14px;font-size:13px;color:var(--success);">✓ ' + esc(S.note) + '</div>';
    if (S.tab === "plan") html += renderPlan();
    else if (S.tab === "train") html += renderTrain();
    else html += renderProgress();
    html += '</div>';
    root.innerHTML = html;
  }

  function flash(msg) {
    S.note = msg;
    render();
    setTimeout(function () { S.note = ""; render(); }, 1800);
  }

  // ---------- PLAN ----------
  function renderPlan() {
    var html = "";
    if (S.plan.length === 0) {
      html += '<div class="card" style="border-style:dashed;padding:24px;text-align:center;font-size:13px;color:var(--text-dim);margin-bottom:16px;">Тут поки що порожньо. Додайте перший день тренувань — наприклад «Груди/Трицепс» чи «Ноги».</div>';
    }
    html += '<div style="display:flex;flex-direction:column;gap:10px;">';
    S.plan.forEach(function (day) {
      var isOpen = S.openDayId === day.id;
      html += '<div class="card">';
      html += '<div class="row" style="gap:8px;padding:10px 12px;">';
      html += '<button style="color:var(--text-dim);" onclick="App.toggleDay(\'' + day.id + '\')">' + (isOpen ? '▾' : '▸') + '</button>';
      html += '<input value="' + esc(day.name) + '" placeholder="Назва дня" oninput="App.renameDay(\'' + day.id + '\', this.value)" style="flex:1;font-size:14px;font-weight:500;">';
      html += '<span class="tabular" style="font-size:11px;color:#5c5d63;">' + day.exercises.length + ' вправ</span>';
      html += '<button class="icon-btn danger" title="Видалити день" onclick="App.removeDay(\'' + day.id + '\')">✕</button>';
      html += '</div>';
      if (isOpen) {
        html += '<div style="border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px;">';
        day.exercises.forEach(function (ex) {
          html += '<div style="display:grid;grid-template-columns:5fr 2fr 2fr 2fr auto;gap:6px;align-items:center;background:rgba(255,255,255,0.03);border-radius:4px;padding:6px 8px;">';
          html += '<input value="' + esc(ex.name) + '" placeholder="Назва вправи" oninput="App.updateExercise(\'' + day.id + '\',\'' + ex.id + '\',\'name\',this.value)" style="font-size:13px;">';
          html += '<input value="' + esc(ex.targetSets) + '" placeholder="сети" inputmode="numeric" oninput="this.value=this.value.replace(/\\D/g,\'\');App.updateExercise(\'' + day.id + '\',\'' + ex.id + '\',\'targetSets\',this.value)" class="tabular" style="font-size:13px;text-align:center;">';
          html += '<input value="' + esc(ex.targetReps) + '" placeholder="повт." oninput="App.updateExercise(\'' + day.id + '\',\'' + ex.id + '\',\'targetReps\',this.value)" style="font-size:13px;text-align:center;">';
          html += '<input value="' + esc(ex.targetWeight) + '" placeholder="кг" inputmode="decimal" oninput="this.value=this.value.replace(/[^0-9.]/g,\'\');App.updateExercise(\'' + day.id + '\',\'' + ex.id + '\',\'targetWeight\',this.value)" class="tabular" style="font-size:13px;text-align:center;">';
          html += '<button class="icon-btn danger" title="Видалити вправу" onclick="App.removeExercise(\'' + day.id + '\',\'' + ex.id + '\')">✕</button>';
          html += '</div>';
        });
        html += '<div style="display:grid;grid-template-columns:5fr 2fr 2fr 2fr auto;gap:6px;font-size:10px;color:#5c5d63;padding:0 8px;"><span></span><span style="text-align:center;">сети</span><span style="text-align:center;">повтори</span><span style="text-align:center;">кг (ціль)</span><span></span></div>';
        html += '<button style="color:var(--accent);font-size:13px;text-align:left;padding:4px 0;" onclick="App.addExercise(\'' + day.id + '\')">+ Додати вправу</button>';
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    html += '<button class="card" style="margin-top:16px;width:100%;padding:10px;font-size:13px;" onclick="App.addDay()">+ Додати день тренувань</button>';
    return html;
  }

  // ---------- TRAIN ----------
  function renderTrain() {
    var html = "";
    if (!S.activeSession) {
      if (S.plan.length === 0) {
        html += '<div class="card" style="border-style:dashed;padding:24px;text-align:center;font-size:13px;color:var(--text-dim);">Спочатку створіть план тренувань.';
        html += '<button style="display:block;margin:8px auto 0;color:var(--accent);font-size:13px;" onclick="App.setTab(\'plan\')">Перейти до плану →</button></div>';
      } else {
        html += '<p style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">Оберіть день, щоб почати тренування:</p>';
        html += '<div style="display:flex;flex-direction:column;gap:8px;">';
        S.plan.forEach(function (day) {
          html += '<button class="card row" style="justify-content:space-between;padding:12px;text-align:left;" onclick="App.startSession(\'' + day.id + '\')">';
          html += '<span><span style="display:block;font-size:14px;font-weight:500;">' + esc(day.name) + '</span><span style="display:block;font-size:12px;color:var(--text-dim);">' + day.exercises.length + ' вправ</span></span>';
          html += '<span style="color:var(--accent);">▶</span></button>';
        });
        html += '</div>';
      }
      return html;
    }
    var s = S.activeSession;
    html += '<div class="row" style="justify-content:space-between;margin-bottom:16px;">';
    html += '<div><h2 class="oswald" style="font-size:16px;font-weight:600;margin:0;">' + esc(s.dayName) + '</h2><p style="font-size:12px;color:var(--text-dim);margin:2px 0 0;">' + formatDate(s.date) + '</p></div>';
    html += '<button style="color:var(--text-dim);font-size:12px;" onclick="App.cancelSession()">Скасувати</button></div>';
    html += '<div style="display:flex;flex-direction:column;gap:14px;">';
    s.exercises.forEach(function (ex, exIdx) {
      html += '<div class="card" style="padding:12px;">';
      html += '<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px;">';
      html += '<h3 style="font-size:14px;font-weight:500;margin:0;">' + esc(ex.name) + '</h3>';
      html += '<span class="tabular" style="font-size:11px;color:#5c5d63;">ціль: ' + esc(ex.targetReps) + (ex.targetWeight ? (' · ' + esc(ex.targetWeight) + 'кг') : '') + '</span></div>';
      html += '<div style="display:flex;flex-direction:column;gap:6px;">';
      html += '<div style="display:grid;grid-template-columns:1fr 4fr 4fr 3fr;gap:6px;font-size:10px;color:#5c5d63;padding:0 4px;"><span>#</span><span>кг</span><span>повт.</span><span></span></div>';
      ex.sets.forEach(function (set, setIdx) {
        html += '<div style="display:grid;grid-template-columns:1fr 4fr 4fr 3fr;gap:6px;align-items:center;border-radius:4px;padding:6px 4px;background:' + (set.completed ? 'rgba(16,185,129,0.12)' : 'rgba(255,255,255,0.03)') + ';">';
        html += '<span class="tabular" style="font-size:12px;color:var(--text-dim);">' + (setIdx + 1) + '</span>';
        html += '<input value="' + esc(set.weight) + '" inputmode="decimal" oninput="this.value=this.value.replace(/[^0-9.]/g,\'\');App.updateSet(' + exIdx + ',' + setIdx + ',\'weight\',this.value)" class="tabular" style="font-size:13px;border-bottom:1px solid var(--border);">';
        html += '<input value="' + esc(set.reps) + '" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,\'\');App.updateSet(' + exIdx + ',' + setIdx + ',\'reps\',this.value)" class="tabular" style="font-size:13px;border-bottom:1px solid var(--border);">';
        html += '<div class="row" style="justify-content:flex-end;gap:2px;">';
        html += '<button class="icon-btn' + (set.completed ? ' accent' : '') + '" title="Виконано" onclick="App.toggleSetDone(' + exIdx + ',' + setIdx + ')">✓</button>';
        html += '<button class="icon-btn danger" title="Видалити сет" onclick="App.removeSet(' + exIdx + ',' + setIdx + ')">✕</button>';
        html += '</div></div>';
      });
      html += '</div>';
      html += '<button style="margin-top:8px;color:var(--accent);font-size:12px;" onclick="App.addSet(' + exIdx + ')">+ Додати сет</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<button style="margin-top:18px;width:100%;background:var(--accent);color:#fff;border-radius:6px;padding:12px;font-size:14px;font-weight:500;" onclick="App.finishSession()">■ Завершити тренування</button>';
    return html;
  }

  // ---------- PROGRESS ----------
  function computeStats() {
    var map = {};
    S.logs.forEach(function (session) {
      session.exercises.forEach(function (ex) {
        var key = ex.name;
        if (!map[key]) map[key] = { best: 0, bestReps: 0 };
        var mx = 0, mxReps = 0;
        ex.sets.forEach(function (set) {
          var w = parseFloat(set.weight) || 0, r = parseFloat(set.reps) || 0;
          if (w > mx) { mx = w; mxReps = r; }
        });
        if (mx > map[key].best) { map[key].best = mx; map[key].bestReps = mxReps; }
      });
    });
    return map;
  }

  function renderProgress() {
    var stats = computeStats();
    var statEntries = Object.keys(stats).filter(function (k) { return stats[k].best > 0; });
    var totalSessions = S.logs.length;
    var last7 = S.logs.filter(function (l) { return Date.now() - new Date(l.date).getTime() < 7 * 24 * 3600 * 1000; }).length;
    var html = "";
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;">';
    html += '<div class="card" style="padding:12px;"><p class="oswald tabular" style="font-size:24px;font-weight:600;margin:0;">' + totalSessions + '</p><p style="font-size:11px;color:var(--text-dim);margin:2px 0 0;">всього тренувань</p></div>';
    html += '<div class="card" style="padding:12px;"><p class="oswald tabular" style="font-size:24px;font-weight:600;margin:0;">' + last7 + '</p><p style="font-size:11px;color:var(--text-dim);margin:2px 0 0;">за останні 7 днів</p></div>';
    html += '</div>';
    if (statEntries.length > 0) {
      html += '<div style="margin-bottom:18px;"><h3 style="font-size:13px;font-weight:500;margin-bottom:8px;">📈 Особисті рекорди</h3><div class="card">';
      statEntries.forEach(function (name, i) {
        html += '<div class="row" style="justify-content:space-between;padding:8px 12px;font-size:13px;' + (i ? 'border-top:1px solid var(--border);' : '') + '"><span>' + esc(name) + '</span><span class="tabular dim">' + stats[name].best + 'кг × ' + stats[name].bestReps + '</span></div>';
      });
      html += '</div></div>';
    }
    html += '<h3 style="font-size:13px;font-weight:500;margin-bottom:8px;">Історія тренувань</h3>';
    if (S.logs.length === 0) {
      html += '<div class="card" style="border-style:dashed;padding:24px;text-align:center;font-size:13px;color:var(--text-dim);">Ще немає записаних тренувань. Завершіть перше на вкладці «Тренування».</div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:8px;">';
      S.logs.forEach(function (session) {
        var isOpen = S.openLogId === session.id;
        var vol = Math.round(sessionVolume(session));
        html += '<div class="card">';
        html += '<div class="row" style="gap:8px;padding:10px 12px;">';
        html += '<button style="color:var(--text-dim);" onclick="App.toggleLog(\'' + session.id + '\')">' + (isOpen ? '▾' : '▸') + '</button>';
        html += '<div style="flex:1;"><p style="font-size:13px;font-weight:500;margin:0;">' + esc(session.dayName) + '</p><p class="tabular" style="font-size:11px;color:var(--text-dim);margin:2px 0 0;">' + formatDate(session.date) + " · об'єм " + vol + ' кг</p></div>';
        html += '<button class="icon-btn danger" title="Видалити запис" onclick="App.deleteLog(\'' + session.id + '\')">🗑</button></div>';
        if (isOpen) {
          html += '<div style="border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px;">';
          session.exercises.forEach(function (ex) {
            html += '<div><p style="font-size:12px;color:var(--text-dim);margin:0 0 4px;">' + esc(ex.name) + '</p><div style="display:flex;flex-wrap:wrap;gap:6px;">';
            ex.sets.forEach(function (set) {
              html += '<span class="tabular card" style="font-size:12px;padding:4px 8px;">' + (set.weight || 0) + 'кг × ' + (set.reps || 0) + '</span>';
            });
            html += '</div></div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }
    return html;
  }

  // ================= ACTIONS =================
  var App = {
    setTab: function (t) { S.tab = t; render(); },

    // plan
    addDay: function () {
      var day = defaultDay(S.plan.length + 1);
      S.plan.push(day); S.openDayId = day.id;
      render();
      saveDaysIndex(S.plan); saveDay(day);
    },
    removeDay: function (id) {
      if (!window.confirm("Видалити цей день тренувань разом з усіма вправами?")) return;
      S.plan = S.plan.filter(function (d) { return d.id !== id; });
      render();
      saveDaysIndex(S.plan); deleteDay(id);
    },
    toggleDay: function (id) { S.openDayId = S.openDayId === id ? null : id; render(); },
    renameDay: function (id, name) {
      var day = S.plan.find(function (d) { return d.id === id; });
      if (!day) return;
      day.name = name;
      clearTimeout(dayTimers[id]);
      dayTimers[id] = setTimeout(function () { saveDay(day); }, 500);
    },
    addExercise: function (dayId) {
      var day = S.plan.find(function (d) { return d.id === dayId; });
      if (!day) return;
      day.exercises.push(defaultExercise());
      render();
      saveDay(day);
    },
    updateExercise: function (dayId, exId, field, value) {
      var day = S.plan.find(function (d) { return d.id === dayId; });
      if (!day) return;
      var ex = day.exercises.find(function (e) { return e.id === exId; });
      if (!ex) return;
      ex[field] = value;
      clearTimeout(dayTimers[dayId]);
      dayTimers[dayId] = setTimeout(function () { saveDay(day); }, 500);
    },
    removeExercise: function (dayId, exId) {
      var day = S.plan.find(function (d) { return d.id === dayId; });
      if (!day) return;
      day.exercises = day.exercises.filter(function (e) { return e.id !== exId; });
      render();
      saveDay(day);
    },

    // session
    startSession: function (dayId) {
      var day = S.plan.find(function (d) { return d.id === dayId; });
      if (!day) return;
      var session = {
        id: uid(), dayId: day.id, dayName: day.name, date: todayISO(),
        exercises: day.exercises.map(function (ex) {
          var n = Math.max(1, parseInt(ex.targetSets) || 1);
          var sets = [];
          for (var i = 0; i < n; i++) sets.push({ weight: ex.targetWeight || "", reps: "", completed: false });
          return { exerciseId: ex.id, name: ex.name || "Вправа", targetReps: ex.targetReps, targetWeight: ex.targetWeight, sets: sets };
        })
      };
      S.activeSession = session;
      render();
      persistSession(session);
    },
    cancelSession: function () {
      if (!window.confirm("Скасувати поточне тренування? Незбережений прогрес буде втрачено.")) return;
      S.activeSession = null;
      render();
      persistSession(null);
    },
    finishSession: function () {
      if (!S.activeSession) return;
      var cleaned = JSON.parse(JSON.stringify(S.activeSession));
      cleaned.exercises.forEach(function (ex) { ex.sets = ex.sets.filter(function (s) { return s.weight !== "" || s.reps !== ""; }); });
      S.logs.unshift(cleaned);
      S.activeSession = null;
      S.tab = "progress";
      render();
      saveLog(cleaned); saveLogsIndex(S.logs); persistSession(null);
      flash("Тренування збережено");
    },
    updateSet: function (exIdx, setIdx, field, value) {
      if (!S.activeSession) return;
      S.activeSession.exercises[exIdx].sets[setIdx][field] = value;
      clearTimeout(sessionTimer);
      sessionTimer = setTimeout(function () { persistSession(S.activeSession); }, 400);
    },
    addSet: function (exIdx) {
      if (!S.activeSession) return;
      S.activeSession.exercises[exIdx].sets.push({ weight: "", reps: "", completed: false });
      render();
      persistSession(S.activeSession);
    },
    removeSet: function (exIdx, setIdx) {
      if (!S.activeSession) return;
      S.activeSession.exercises[exIdx].sets.splice(setIdx, 1);
      render();
      persistSession(S.activeSession);
    },
    toggleSetDone: function (exIdx, setIdx) {
      if (!S.activeSession) return;
      var set = S.activeSession.exercises[exIdx].sets[setIdx];
      set.completed = !set.completed;
      render();
      persistSession(S.activeSession);
    },

    // history
    toggleLog: function (id) { S.openLogId = S.openLogId === id ? null : id; render(); },
    deleteLog: function (id) {
      if (!window.confirm("Видалити цей запис тренування?")) return;
      S.logs = S.logs.filter(function (l) { return l.id !== id; });
      render();
      deleteLogEntry(id); saveLogsIndex(S.logs);
    }
  };
  window.App = App;

  loadAll().then(function (data) {
    S.plan = data.plan; S.logs = data.logs; S.activeSession = data.activeSession;
    render();
  }).catch(function () {
    render();
  });
})();
</script>
</body>
</html>
