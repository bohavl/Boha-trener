<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Журнал тренувань</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --surface3: #3a3a3c;
    --border: #38383a;
    --text: #f5f5f7;
    --text-dim: #98989d;
    --accent: #0a84ff;
    --danger: #ff453a;
    --success: #32d74b;
    --warn: #ff9f0a;
    --purple: #bf5af2;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }
  input, textarea, select { font-family: inherit; color: inherit; background: none; border: none; outline: none; font-size: 16px; }
  button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; font-size: 16px; }
  ::placeholder { color: #6e6e73; }
  .tabular { font-variant-numeric: tabular-nums; }
  .wrap { padding: 20px 18px 48px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .card-outline { border: 1.5px dashed var(--border); border-radius: var(--radius); }
  .dim { color: var(--text-dim); }
  .row { display: flex; align-items: center; }
  .divider { border-top: 0.5px solid var(--border); }
  .icon-btn { padding: 7px; border-radius: 8px; font-size: 16px; line-height: 1; color: var(--text-dim); }
  .icon-btn.danger { color: var(--danger); }
  .icon-btn.accent { color: var(--accent); }
  .section-label { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-dim); margin: 22px 6px 8px; display:flex; justify-content:space-between; align-items:center; }
  .section-label:first-child { margin-top: 0; }
  .btn-primary { width: 100%; background: var(--accent); color: #fff; border-radius: var(--radius); padding: 15px; font-size: 17px; font-weight: 600; }
  .btn-secondary { width: 100%; background: var(--surface); color: var(--text); border-radius: var(--radius); padding: 15px; font-size: 16px; font-weight: 500; }
  .btn-ghost { color: var(--accent); font-size: 15px; font-weight: 500; }
  .segwrap { display: flex; background: var(--surface); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg-btn { flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--text-dim); }
  .seg-btn.active { background: var(--surface2); color: var(--text); }
  .list-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; min-height: 48px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 12px; background: var(--surface2); font-size: 14px; font-weight: 500; text-align: center; white-space: nowrap; }
  .chip.active { background: var(--accent); color: #fff; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--surface3); color:var(--text-dim); }
  .badge.warn { background: rgba(255,159,10,0.18); color: var(--warn); }
  .badge.purple { background: rgba(191,90,242,0.18); color: var(--purple); }
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50; display: flex; align-items: flex-end; }
  .sheet { width: 100%; max-height: 86vh; background: var(--surface); border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .sheet-handle { width: 36px; height: 5px; background: var(--border); border-radius: 3px; margin: 0 auto 12px; }
  .search-input { background: var(--surface2); border-radius: 10px; padding: 11px 14px; font-size: 16px; width: 100%; }
  .field { background: var(--surface2); border-radius: 10px; padding: 10px 12px; width: 100%; }
  textarea.mono { font-family: ui-monospace, monospace; font-size: 13px; width:100%; min-height:180px; background:var(--surface2); border-radius:10px; padding:12px; }
  .stopwatch { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:13px; position:relative; }
  .cal-dot { position:absolute; bottom:4px; width:5px; height:5px; border-radius:50%; background:var(--accent); }
</style>
</head>

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  var useCloud = !!(tg && tg.CloudStorage);

  // ---------- storage abstraction with local mirror (basic offline resilience) ----------
  function mirrorSet(key, value) { try { localStorage.setItem("mirror:" + key, value); } catch (e) {} }
  function mirrorGet(key) { try { return localStorage.getItem("mirror:" + key); } catch (e) { return null; } }

  function csGetItems(keys) {
    return new Promise(function (resolve) {
      if (useCloud) {
        tg.CloudStorage.getItems(keys, function (err, values) {
          var out = err ? {} : (values || {});
          keys.forEach(function (k) { if (!out[k]) { var m = mirrorGet(k); if (m !== null) out[k] = m; } });
          resolve(out);
        });
      } else {
        var out = {};
        keys.forEach(function (k) { var v = localStorage.getItem(k); if (v !== null) out[k] = v; else { var m = mirrorGet(k); if (m !== null) out[k] = m; } });
        resolve(out);
      }
    });
  }
  function csSet(key, value) {
    mirrorSet(key, value);
    return new Promise(function (resolve) {
      if (useCloud) { tg.CloudStorage.setItem(key, value, function () { resolve(); }); }
      else { try { localStorage.setItem(key, value); } catch (e) {} resolve(); }
    });
  }
  function csRemove(key) {
    try { localStorage.removeItem("mirror:" + key); } catch (e) {}
    return new Promise(function (resolve) {
      if (useCloud) { tg.CloudStorage.removeItem(key, function () { resolve(); }); }
      else { try { localStorage.removeItem(key); } catch (e) {} resolve(); }
    });
  }

  // ---------- helpers ----------
  function uid() { return Date.now() + "-" + Math.random().toString(36).slice(2, 9); }
  function todayISO() { return new Date().toISOString(); }
  function formatDate(iso) { return new Date(iso).toLocaleDateString("uk-UA", { day: "2-digit", month: "short", year: "numeric" }); }
  function formatDay(iso) { return new Date(iso).toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit" }); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
  function jsStr(s) { return esc(s).replace(/'/g, "\\'"); }
  function fmtTime(ms) {
    var total = Math.floor(ms / 1000), m = Math.floor(total / 60), s = total % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function est1RM(weight, reps) {
    weight = parseFloat(weight) || 0; reps = parseFloat(reps) || 0;
    if (weight <= 0 || reps <= 0) return 0;
    return Math.round(weight * (1 + reps / 30));
  }
  function startOfWeek(d) {
    var date = new Date(d); var day = date.getDay(); var diff = (day === 0 ? -6 : 1) - day;
    date.setDate(date.getDate() + diff); date.setHours(0, 0, 0, 0); return date;
  }
  function sessionVolume(session) {
    return session.exercises.reduce(function (sum, ex) {
      return sum + ex.sets.reduce(function (s, set) {
        if (set.type === "warmup") return s;
        var w = parseFloat(set.weight) || 0, r = parseFloat(set.reps) || 0;
        return s + w * r;
      }, 0);
    }, 0);
  }

  };
  var EXCATS = Object.keys(EXLIB);
  var EXFLAT = [];
  EXCATS.forEach(function (cat) { EXLIB[cat].forEach(function (item) { EXFLAT.push(Object.assign({ cat: cat }, item)); }); });
  var EXBYNAME = {};

  // ---------- data layer ----------
  function loadAll() {
    return csGetItems(["programs_index", "log_index", "active_session", "bw_index"]).then(function (idx) {
      var progIds = idx.programs_index ? JSON.parse(idx.programs_index) : [];
      var logIds = idx.log_index ? JSON.parse(idx.log_index) : [];
      var bwIds = idx.bw_index ? JSON.parse(idx.bw_index) : [];
      var progKeys = progIds.map(function (id) { return "prog:" + id; });
      var logKeys = logIds.map(function (id) { return "log:" + id; });
      var bwKeys = bwIds.map(function (id) { return "bw:" + id; });
      return Promise.all([
        progKeys.length ? csGetItems(progKeys) : Promise.resolve({}),
        logKeys.length ? csGetItems(logKeys) : Promise.resolve({}),
        bwKeys.length ? csGetItems(bwKeys) : Promise.resolve({})
      ]).then(function (results) {
        var progVals = results[0], logVals = results[1], bwVals = results[2];
        var programs = progIds.map(function (id) { return progVals["prog:" + id] ? JSON.parse(progVals["prog:" + id]) : null; }).filter(Boolean);
        var dayIdSet = [];
        programs.forEach(function (p) { (p.dayIds || []).forEach(function (id) { dayIdSet.push(id); }); });
        var dayKeys = dayIdSet.map(function (id) { return "day:" + id; });
        return (dayKeys.length ? csGetItems(dayKeys) : Promise.resolve({})).then(function (dayVals) {
          var days = {};
          dayIdSet.forEach(function (id) { if (dayVals["day:" + id]) { try { days[id] = JSON.parse(dayVals["day:" + id]); } catch (e) {} } });
          var logs = logIds.map(function (id) { return logVals["log:" + id] ? JSON.parse(logVals["log:" + id]) : null; }).filter(Boolean);
          var bw = bwIds.map(function (id) { return bwVals["bw:" + id] ? JSON.parse(bwVals["bw:" + id]) : null; }).filter(Boolean);
          var activeSession = null;
          if (idx.active_session) { try { activeSession = JSON.parse(idx.active_session); } catch (e) {} }
          return { programs: programs, days: days, logs: logs, activeSession: activeSession, bw: bw };
        });
      });
    });
  }
  function saveProgramsIndex(programs) { return csSet("programs_index", JSON.stringify(programs.map(function (p) { return p.id; }))); }
  function saveProgram(p) { return csSet("prog:" + p.id, JSON.stringify(p)); }
  function deleteProgramKey(id) { return csRemove("prog:" + id); }
  function saveDay(day) { return csSet("day:" + day.id, JSON.stringify(day)); }
  function deleteDayKey(id) { return csRemove("day:" + id); }
  function saveLogsIndex(logs) { return csSet("log_index", JSON.stringify(logs.map(function (l) { return l.id; }))); }
  function saveLog(session) { return csSet("log:" + session.id, JSON.stringify(session)); }
  function deleteLogKey(id) { return csRemove("log:" + id); }
  function persistSession(s) { return csSet("active_session", JSON.stringify(s || null)); }
  function saveBwIndex(bw) { return csSet("bw_index", JSON.stringify(bw.map(function (b) { return b.id; }))); }
  function saveBw(entry) { return csSet("bw:" + entry.id, JSON.stringify(entry)); }
  function deleteBwKey(id) { return csRemove("bw:" + id); }
  function saveHistory(dayId, snapshot) {
    return csGetItems(["hist:" + dayId]).then(function (r) {
      var arr = r["hist:" + dayId] ? JSON.parse(r["hist:" + dayId]) : [];
      arr.unshift({ ts: Date.now(), snapshot: snapshot });
      arr = arr.slice(0, 3);
      return csSet("hist:" + dayId, JSON.stringify(arr));
    });
  }
  function loadHistory(dayId) {
    return csGetItems(["hist:" + dayId]).then(function (r) { return r["hist:" + dayId] ? JSON.parse(r["hist:" + dayId]) : []; });
  }

  // ---------- state ----------

  // ---------- PROGRESS ----------
  function computeStats() {
    var map = {};
    S.logs.forEach(function (session) {
      session.exercises.forEach(function (ex) {
        var key = ex.name;
        if (!map[key]) map[key] = { best: 0, bestReps: 0, best1rm: 0, history: [] };
        var mx = 0, mxReps = 0, mx1 = 0;
        ex.sets.forEach(function (set) {
          if (set.type === "warmup") return;
          var w = parseFloat(set.weight) || 0, r = parseFloat(set.reps) || 0;
          if (w > mx) { mx = w; mxReps = r; }
          var e1 = est1RM(w, r);
          if (e1 > mx1) mx1 = e1;
        });
        if (mx > 0) {
          map[key].history.push({ date: session.date, weight: mx });
          if (mx > map[key].best) { map[key].best = mx; map[key].bestReps = mxReps; }
          if (mx1 > map[key].best1rm) map[key].best1rm = mx1;
        }
      });
    });
    Object.keys(map).forEach(function (k) {
      var h = map[k].history.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
      if (h.length >= 2) {
        var last = h[h.length - 1].weight, prev = h[h.length - 2].weight;
        map[k].trendUp = last >= prev && last >= map[k].best * 0.95;
      }
    });
    return map;
  }

  function buildSparkline(vals) {
    vals = vals.filter(function (v) { return v > 0; });
    if (vals.length < 2) return '<p class="dim" style="font-size:12px;">Недостатньо даних для графіка.</p>';
    var w = 280, h = 60, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max) { min -= 1; max += 1; }
    var pts = vals.map(function (v, i) {
      var x = (i / (vals.length - 1)) * (w - 10) + 5;
      var y = h - 8 - ((v - min) / (max - min)) * (h - 16);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:60px;margin-top:8px;"><polyline points="' + pts + '" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

      timerInterval = setInterval(function () {
        if (!S.activeSession) return;

          if (ex.timerStart) {
            var el = document.getElementById("timer-" + i);
            if (el) el.textContent = fmtTime((ex.timerAccum || 0) + (Date.now() - ex.timerStart));
          }
        });
      }, 1000);
    } else if (!hasRunning && timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  var App = {
    setTab: function (t) { S.tab = t; render(); },

    // programs
    addProgram: function () {
      var p = defaultProgram(S.programs.length + 1);
      S.programs.push(p); S.currentProgramId = p.id;
      render(); saveProgramsIndex(S.programs); saveProgram(p);
    },
    selectProgram: function (id) { S.currentProgramId = id; render(); },
    renameProgram: function (val) {
      var p = currentProgram(); if (!p) return; p.name = val;
      clearTimeout(App._pnTimer); App._pnTimer = setTimeout(function () { saveProgram(p); }, 500);
    },
    deleteProgram: function () {
      var p = currentProgram(); if (!p) return;
      if (!window.confirm('Видалити програму "' + p.name + '" разом з усіма днями?')) return;
      (p.dayIds || []).forEach(function (id) { delete S.days[id]; deleteDayKey(id); });
      S.programs = S.programs.filter(function (x) { return x.id !== p.id; });
      S.currentProgramId = S.programs.length ? S.programs[0].id : null;
      render(); saveProgramsIndex(S.programs); deleteProgramKey(p.id);
    },

    // days
    addDay: function () {
      var p = currentProgram(); if (!p) return;
      var day = defaultDay((p.dayIds || []).length + 1, p.id);
      S.days[day.id] = day; p.dayIds = (p.dayIds || []).concat([day.id]);
      S.openDayId = day.id;
      saveDay(day); saveProgram(p);
      App.enterEdit(day.id);
    },
    removeDay: function (id) {
      if (!window.confirm("Видалити цей день тренувань разом з усіма вправами?")) return;
      var p = currentProgram(); if (!p) return;
      p.dayIds = p.dayIds.filter(function (x) { return x !== id; });
      delete S.days[id];
      render(); saveProgram(p); deleteDayKey(id);
    },
    duplicateDay: function (id) {
      var p = currentProgram(); if (!p) return;
      var orig = S.days[id]; if (!orig) return;
      var copy = JSON.parse(JSON.stringify(orig));
      copy.id = uid(); copy.name = orig.name + " (копія)";
      S.days[copy.id] = copy;
      var idx = p.dayIds.indexOf(id);
      p.dayIds.splice(idx + 1, 0, copy.id);
      render(); saveDay(copy); saveProgram(p);
    },
    moveDay: function (id, dir) {
      var p = currentProgram(); if (!p) return;
      var idx = p.dayIds.indexOf(id); var newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= p.dayIds.length) return;
      var tmp = p.dayIds[idx]; p.dayIds[idx] = p.dayIds[newIdx]; p.dayIds[newIdx] = tmp;
      render(); saveProgram(p);
    },
    toggleDay: function (id) { S.openDayId = S.openDayId === id ? null : id; render(); },

    // edit mode
    enterEdit: function (id) {
      S.editDayId = id; S.editDraft = JSON.parse(JSON.stringify(S.days[id]));
      S.openDayId = id; render();
    },
    cancelEdit: function () { S.editDayId = null; S.editDraft = null; render(); },
    confirmEdit: function () {
      if (!window.confirm("Зберегти зміни в цьому дні?")) return;
      var oldDay = S.days[S.editDayId];
      saveHistory(S.editDayId, oldDay).then(function () {});
      S.days[S.editDayId] = S.editDraft;
      saveDay(S.editDraft);
      S.editDayId = null; S.editDraft = null;
      render();
    },
    draftField: function (field, val) { S.editDraft[field] = val; render(); },
    draftToggleTag: function (t) {
      var tags = S.editDraft.tags || [];
      var i = tags.indexOf(t);
      if (i === -1) tags.push(t); else tags.splice(i, 1);
      S.editDraft.tags = tags; render();
    },
    draftExField: function (i, field, val) { S.editDraft.exercises[i][field] = val; render(); },
    draftRemoveEx: function (i) { S.editDraft.exercises.splice(i, 1); render(); },
    draftMoveEx: function (i, dir) {
      var arr = S.editDraft.exercises; var ni = i + dir;
      if (ni < 0 || ni >= arr.length) return;
      var t = arr[i]; arr[i] = arr[ni]; arr[ni] = t; render();
    },
    draftToggleLink: function (i) { S.editDraft.exercises[i].linkNext = !S.editDraft.exercises[i].linkNext; render(); },

    // history
    openHistory: function (dayId) {
      S.historyView = { dayId: dayId, loading: true, items: [] };
      render();
      loadHistory(dayId).then(function (items) { S.historyView = { dayId: dayId, loading: false, items: items }; render(); });
    },
    closeHistory: function () { S.historyView = null; render(); },
    restoreHistory: function (i) {
      var item = S.historyView.items[i];
      if (!window.confirm("Відновити цю версію дня? Поточний варіант буде замінено.")) return;
      S.days[S.historyView.dayId] = item.snapshot;
      saveDay(item.snapshot);
      S.historyView = null; render();
    },

    // export/import
    exportOpen: function () { S.exportSheet = true; render(); },
    exportClose: function () { S.exportSheet = false; render(); },
    copyExport: function () {
      var el = document.getElementById("exportText");
      if (el) { el.select(); try { document.execCommand("copy"); } catch (e) {} try { navigator.clipboard.writeText(el.value); } catch (e) {} }
      flash("Скопійовано");
    },
    importOpen: function () { S.importSheet = true; render(); },
    importClose: function () { S.importSheet = false; render(); },
    doImport: function () {
      var el = document.getElementById("importText");
      if (!el || !el.value.trim()) return;
      var data;
      try { data = JSON.parse(el.value); } catch (e) { window.alert("Некоректний JSON"); return; }
      var p = defaultProgram(S.programs.length + 1);
      if (data.program && data.program.name) p.name = data.program.name + " (імпорт)";
      var newDays = (data.days || []).map(function (d) {
        var nd = JSON.parse(JSON.stringify(d));
        nd.id = uid(); nd.programId = p.id;
        (nd.exercises || []).forEach(function (ex) { ex.id = uid(); });
        return nd;
      });
      newDays.forEach(function (d) { S.days[d.id] = d; saveDay(d); });
      p.dayIds = newDays.map(function (d) { return d.id; });
      S.programs.push(p); S.currentProgramId = p.id;
      saveProgramsIndex(S.programs); saveProgram(p);
      S.importSheet = false; render();
      flash("Програму імпортовано");
    },

    // picker
    openPicker: function (substitute, exIdx) { S.picker = { substituteIdx: substitute ? exIdx : null, equip: null }; render(); },
    closePicker: function () { S.picker = null; render(); },
    pickerEquip: function (eq) {
      S.picker.equip = eq;
      var el = document.getElementById("pickerResults");
      var search = document.getElementById("pickerSearchInput");
      var q = search ? search.value.trim() : "";
      render();
    },
    pickerFilter: function (value) {
      var el = document.getElementById("pickerResults");
      if (!el) return;
      var q = value.trim();
      if (S.picker.substituteIdx != null && !q) { el.innerHTML = renderPickerSubstituteSuggestions(S.picker.substituteIdx); return; }
      el.innerHTML = q ? renderPickerSearchResults(q) : renderPickerCategories();
    },
    pickerShowCategory: function (cat) { var el = document.getElementById("pickerResults"); if (el) el.innerHTML = renderPickerCategoryList(cat); },
    pickerBack: function () {
      var el = document.getElementById("pickerResults"); if (!el) return;
      if (S.picker.substituteIdx != null) el.innerHTML = renderPickerSubstituteSuggestions(S.picker.substituteIdx);
      else el.innerHTML = renderPickerCategories();
    },
    pickerSelect: function (name) {
      if (!S.picker) return;
      if (S.picker.substituteIdx != null) {
        S.editDraft.exercises[S.picker.substituteIdx].name = name;
      } else {
        S.editDraft.exercises.push({ id: uid(), name: name, targetSets: 3, targetReps: "8-12", targetWeight: "", linkNext: false });
      }
      S.picker = null; render();
    },

    // check-in + session start
    requestStart: function (dayId) { S.checkinPending = { dayId: dayId, energy: 3, sleep: 3, note: "" }; render(); },
    checkinSet: function (field, val) { S.checkinPending[field] = val; render(); },
    checkinNote: function (val) { S.checkinPending.note = val; },
    checkinCancel: function () { S.checkinPending = null; render(); },
    checkinSubmit: function () {
      var c = S.checkinPending; var day = S.days[c.dayId];
      if (!day) { S.checkinPending = null; render(); return; }
      var session = {
        id: uid(), dayId: day.id, dayName: day.name, tags: day.tags || [], date: todayISO(),
        checkin: { energy: c.energy, sleep: c.sleep, note: c.note },
        exercises: day.exercises.map(function (ex) {
          var n = Math.max(1, parseInt(ex.targetSets) || 1);
          var sets = [];
          for (var i = 0; i < n; i++) sets.push({ type: "normal", weight: ex.targetWeight || "", reps: "", rpe: "", completed: false });
          return { exerciseId: ex.id, name: ex.name || "Вправа", linkNext: ex.linkNext, targetReps: ex.targetReps, targetWeight: ex.targetWeight, sets: sets, timerStart: null, timerAccum: 0 };
        })
      };
      S.activeSession = session; S.checkinPending = null; undoStack = [];
      render(); persistSession(session);
    },
    cancelSession: function () {
      if (!window.confirm("Скасувати поточне тренування? Незбережений прогрес буде втрачено.")) return;
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      S.activeSession = null; render(); persistSession(null);
    },
    finishSession: function () {
      if (!S.activeSession) return;
      var cleaned = JSON.parse(JSON.stringify(S.activeSession));
      cleaned.exercises.forEach(function (ex) {
        ex.sets = ex.sets.filter(function (s) { return s.weight !== "" || s.reps !== ""; });
        delete ex.timerStart;
      });
      S.logs.unshift(cleaned);
      S.activeSession = null; S.tab = "progress";
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      render();
      saveLog(cleaned); saveLogsIndex(S.logs); persistSession(null);
      flash("Тренування збережено");
    },
    pushUndo: function () { if (S.activeSession) { undoStack.push(JSON.stringify(S.activeSession)); if (undoStack.length > 10) undoStack.shift(); } },
    undoLast: function () {
      if (!undoStack.length) return;
      var snap = undoStack.pop();
      try { S.activeSession = JSON.parse(snap); } catch (e) {}
      render(); persistSession(S.activeSession);
    },
    updateSet: function (exIdx, setIdx, field, value) {
      if (!S.activeSession) return;
      S.activeSession.exercises[exIdx].sets[setIdx][field] = value;
      clearTimeout(App._sTimer);
      App._sTimer = setTimeout(function () { persistSession(S.activeSession); }, 400);
    },
    cycleSetType: function (exIdx, setIdx) {
      App.pushUndo();
      var order = ["normal", "warmup", "dropset", "restpause"];
      var set = S.activeSession.exercises[exIdx].sets[setIdx];
      var i = order.indexOf(set.type || "normal");
      set.type = order[(i + 1) % order.length];
      render(); persistSession(S.activeSession);
    },
    addSet: function (exIdx) {
      App.pushUndo();
      S.activeSession.exercises[exIdx].sets.push({ type: "normal", weight: "", reps: "", rpe: "", completed: false });
      render(); persistSession(S.activeSession);
    },
    removeSet: function (exIdx, setIdx) {
      App.pushUndo();
      S.activeSession.exercises[exIdx].sets.splice(setIdx, 1);
      render(); persistSession(S.activeSession);
    },
    toggleSetDone: function (exIdx, setIdx) {
      App.pushUndo();
      var set = S.activeSession.exercises[exIdx].sets[setIdx];
      set.completed = !set.completed;
      render(); persistSession(S.activeSession);
    },
    toggleTimer: function (exIdx) {
      var ex = S.activeSession.exercises[exIdx];
      if (ex.timerStart) { ex.timerAccum = (ex.timerAccum || 0) + (Date.now() - ex.timerStart); ex.timerStart = null; }
      else { ex.timerStart = Date.now(); }
      render(); persistSession(S.activeSession);
    },

    // history log editing
    toggleLog: function (id) { S.openLogId = S.openLogId === id ? null : id; render(); },
    editLogSet: function (logId, exIdx, setIdx, field, val) {
      var log = S.logs.find(function (l) { return l.id === logId; });
      if (!log) return;
      log.exercises[exIdx].sets[setIdx][field] = val;
      clearTimeout(App._logTimer);
      App._logTimer = setTimeout(function () { saveLog(log); }, 500);
    },
    deleteLog: function (id) {
      if (!window.confirm("Видалити цей запис тренування?")) return;
      S.logs = S.logs.filter(function (l) { return l.id !== id; });
      render(); deleteLogKey(id); saveLogsIndex(S.logs);
    },
    togglePR: function (name) { S.openPRName = S.openPRName === name ? null : name; render(); },

    // calendar
    calNav: function (dir) { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + dir, 1); render(); },

    // bodyweight
    addBw: function () {
      var el = document.getElementById("bwInput");
      var val = el ? parseFloat(el.value) : NaN;
      if (!val || val <= 0) return;
      var entry = { id: uid(), date: todayISO(), weight: val };
      S.bw.push(entry);
      render(); saveBw(entry); saveBwIndex(S.bw);
    }
  };
  window.App = App;

  loadAll().then(function (data) {
    S.programs = data.programs; S.days = data.days; S.logs = data.logs;
    S.activeSession = data.activeSession; S.bw = data.bw;
    S.currentProgramId = S.programs.length ? S.programs[0].id : null;
    render();
  }).catch(function () { render(); });
})();
</script>
</body>
</html>
