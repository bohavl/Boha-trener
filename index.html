<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Журнал тренувань</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #0c0c0e;
    --surface: #16171a;
    --border: #2a2b30;
    --text: #e7e7ea;
    --text-dim: #8b8c92;
    --accent: #4F46E5;
    --danger: #f43f5e;
    --success: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  input { font-family: inherit; color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  ::placeholder { color: #55565c; }
  .oswald { font-family: 'Oswald', sans-serif; }
  .tabular { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef, useMemo } = React;

// ---------- Telegram bootstrap ----------
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const useCloud = !!(tg && tg.CloudStorage);

// ---------- storage abstraction (Telegram CloudStorage, fallback: localStorage) ----------
function csGetItems(keys) {
  return new Promise((resolve) => {
    if (useCloud) {
      tg.CloudStorage.getItems(keys, (err, values) => resolve(err ? {} : values || {}));
    } else {
      const out = {};
      keys.forEach(k => { const v = localStorage.getItem(k); if (v !== null) out[k] = v; });
      resolve(out);
    }
  });
}
function csSet(key, value) {
  return new Promise((resolve) => {
    if (useCloud) { tg.CloudStorage.setItem(key, value, () => resolve()); }
    else { localStorage.setItem(key, value); resolve(); }
  });
}
function csRemove(key) {
  return new Promise((resolve) => {
    if (useCloud) { tg.CloudStorage.removeItem(key, () => resolve()); }
    else { localStorage.removeItem(key); resolve(); }
  });
}
function csGetAllKeys() {
  return new Promise((resolve) => {
    if (useCloud) { tg.CloudStorage.getKeys((err, keys) => resolve(err ? [] : keys || [])); }
    else { resolve(Object.keys(localStorage)); }
  });
}

// ---------- helpers ----------
const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
const todayISO = () => new Date().toISOString();
const formatDate = (iso) => new Date(iso).toLocaleDateString("uk-UA", { day: "2-digit", month: "short", year: "numeric" });

function sessionVolume(session) {
  return session.exercises.reduce((sum, ex) => sum + ex.sets.reduce((s, set) => {
    const w = parseFloat(set.weight) || 0, r = parseFloat(set.reps) || 0;
    return s + w * r;
  }, 0), 0);
}

const defaultDay = (n) => ({ id: uid(), name: `День ${n}`, exercises: [] });
const defaultExercise = () => ({ id: uid(), name: "", targetSets: 3, targetReps: "8-10", targetWeight: "" });

// ---------- data layer: chunked storage to respect Telegram's ~4096 char value limit ----------
async function loadAll() {
  const idx = await csGetItems(["days_index", "log_index"]);
  const dayIds = idx.days_index ? JSON.parse(idx.days_index) : [];
  const logIds = idx.log_index ? JSON.parse(idx.log_index) : [];
  const dayKeys = dayIds.map(id => `day:${id}`);
  const logKeys = logIds.map(id => `log:${id}`);
  const dayVals = dayKeys.length ? await csGetItems(dayKeys) : {};
  const logVals = logKeys.length ? await csGetItems(logKeys) : {};
  const plan = dayIds.map(id => dayVals[`day:${id}`] ? JSON.parse(dayVals[`day:${id}`]) : null).filter(Boolean);
  const logs = logIds.map(id => logVals[`log:${id}`] ? JSON.parse(logVals[`log:${id}`]) : null).filter(Boolean);
  return { plan, logs };
}
async function saveDaysIndex(plan) {
  await csSet("days_index", JSON.stringify(plan.map(d => d.id)));
}
async function saveDay(day) {
  await csSet(`day:${day.id}`, JSON.stringify(day));
}
async function deleteDay(dayId) {
  await csRemove(`day:${dayId}`);
}
async function saveLogsIndex(logs) {
  await csSet("log_index", JSON.stringify(logs.map(l => l.id)));
}
async function saveLog(session) {
  await csSet(`log:${session.id}`, JSON.stringify(session));
}
async function deleteLogEntry(logId) {
  await csRemove(`log:${logId}`);
}

// ---------- small UI atoms ----------
function IconBtn({ onClick, title, children, tone }) {
  const color = tone === "danger" ? "var(--danger)" : tone === "accent" ? "var(--accent)" : "var(--text-dim)";
  return (
    <button onClick={onClick} title={title}
      style={{ background: "none", border: "none", color, padding: "6px", borderRadius: 4, fontSize: 14, lineHeight: 1 }}>
      {children}
    </button>
  );
}
function TabBtn({ active, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      background: "none", border: "none", borderBottom: active ? "2px solid var(--accent)" : "2px solid transparent",
      color: active ? "var(--text)" : "var(--text-dim)", padding: "10px 12px", fontSize: 14, fontWeight: 500, whiteSpace: "nowrap"
    }}>{children}</button>
  );
}

// ---------- main app ----------
function App() {
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("plan");
  const [plan, setPlan] = useState([]);
  const [logs, setLogs] = useState([]);
  const [activeSession, setActiveSession] = useState(null);
  const [openDayId, setOpenDayId] = useState(null);
  const [openLogId, setOpenLogId] = useState(null);
  const [note, setNote] = useState("");
  const dayDebounce = useRef({});

  useEffect(() => {
    (async () => {
      const { plan, logs } = await loadAll();
      setPlan(plan);
      setLogs(logs);
      const sessRaw = await csGetItems(["active_session"]);
      if (sessRaw.active_session) {
        try { setActiveSession(JSON.parse(sessRaw.active_session)); } catch {}
      }
      setLoading(false);
    })();
  }, []);

  const flash = (msg) => { setNote(msg); setTimeout(() => setNote(""), 1800); };

  // persist a single day, debounced per-day to avoid spamming CloudStorage on every keystroke
  const scheduleDaySave = (day) => {
    clearTimeout(dayDebounce.current[day.id]);
    dayDebounce.current[day.id] = setTimeout(() => saveDay(day), 500);
  };

  const persistSession = (s) => { csSet("active_session", JSON.stringify(s || null)); };

  // ---------- plan mutations ----------
  const addDay = async () => {
    const day = defaultDay(plan.length + 1);
    const next = [...plan, day];
    setPlan(next); setOpenDayId(day.id);
    await saveDaysIndex(next); await saveDay(day);
  };
  const removeDay = async (dayId) => {
    if (!window.confirm("Видалити цей день тренувань разом з усіма вправами?")) return;
    const next = plan.filter(d => d.id !== dayId);
    setPlan(next);
    await saveDaysIndex(next); await deleteDay(dayId);
  };
  const renameDay = (dayId, name) => {
    const next = plan.map(d => d.id === dayId ? { ...d, name } : d);
    setPlan(next);
    const day = next.find(d => d.id === dayId);
    scheduleDaySave(day);
  };
  const addExercise = async (dayId) => {
    const next = plan.map(d => d.id === dayId ? { ...d, exercises: [...d.exercises, defaultExercise()] } : d);
    setPlan(next);
    await saveDay(next.find(d => d.id === dayId));
  };
  const updateExercise = (dayId, exId, field, value) => {
    const next = plan.map(d => d.id === dayId ? {
      ...d, exercises: d.exercises.map(e => e.id === exId ? { ...e, [field]: value } : e)
    } : d);
    setPlan(next);
    scheduleDaySave(next.find(d => d.id === dayId));
  };
  const removeExercise = async (dayId, exId) => {
    const next = plan.map(d => d.id === dayId ? { ...d, exercises: d.exercises.filter(e => e.id !== exId) } : d);
    setPlan(next);
    await saveDay(next.find(d => d.id === dayId));
  };

  // ---------- session ----------
  const startSession = (day) => {
    const session = {
      id: uid(), dayId: day.id, dayName: day.name, date: todayISO(),
      exercises: day.exercises.map(ex => ({
        exerciseId: ex.id, name: ex.name || "Вправа", targetReps: ex.targetReps, targetWeight: ex.targetWeight,
        sets: Array.from({ length: Math.max(1, parseInt(ex.targetSets) || 1) }, () => ({ weight: ex.targetWeight || "", reps: "", completed: false }))
      }))
    };
    setActiveSession(session); persistSession(session);
  };
  const cancelSession = () => {
    if (!window.confirm("Скасувати поточне тренування? Незбережений прогрес буде втрачено.")) return;
    setActiveSession(null); persistSession(null);
  };
  const finishSession = async () => {
    if (!activeSession) return;
    const cleaned = { ...activeSession, exercises: activeSession.exercises.map(ex => ({ ...ex, sets: ex.sets.filter(s => s.weight !== "" || s.reps !== "") })) };
    const nextLogs = [cleaned, ...logs];
    setLogs(nextLogs);
    await saveLog(cleaned); await saveLogsIndex(nextLogs);
    setActiveSession(null); persistSession(null);
    flash("Тренування збережено"); setTab("progress");
  };
  const mutateSession = (fn) => {
    setActiveSession(s => {
      const next = fn(s);
      persistSession(next);
      return next;
    });
  };
  const updateSet = (exIdx, setIdx, field, value) => mutateSession(s => {
    const next = { ...s, exercises: s.exercises.map(e => ({ ...e, sets: [...e.sets] })) };
    next.exercises[exIdx].sets[setIdx] = { ...next.exercises[exIdx].sets[setIdx], [field]: value };
    return next;
  });
  const addSet = (exIdx) => mutateSession(s => {
    const next = { ...s, exercises: s.exercises.map(e => ({ ...e, sets: [...e.sets] })) };
    next.exercises[exIdx].sets.push({ weight: "", reps: "", completed: false });
    return next;
  });
  const removeSet = (exIdx, setIdx) => mutateSession(s => {
    const next = { ...s, exercises: s.exercises.map(e => ({ ...e, sets: [...e.sets] })) };
    next.exercises[exIdx].sets.splice(setIdx, 1);
    return next;
  });
  const toggleSetDone = (exIdx, setIdx) => mutateSession(s => {
    const next = { ...s, exercises: s.exercises.map(e => ({ ...e, sets: [...e.sets] })) };
    const cur = next.exercises[exIdx].sets[setIdx];
    next.exercises[exIdx].sets[setIdx] = { ...cur, completed: !cur.completed };
    return next;
  });

  // ---------- history ----------
  const deleteLog = async (id) => {
    if (!window.confirm("Видалити цей запис тренування?")) return;
    const next = logs.filter(l => l.id !== id);
    setLogs(next);
    await deleteLogEntry(id); await saveLogsIndex(next);
  };

  const exerciseStats = useMemo(() => {
    const map = {};
    for (const session of logs) {
      for (const ex of session.exercises) {
        const key = ex.name;
        if (!map[key]) map[key] = { best: 0, bestReps: 0, history: [] };
        let mx = 0, mxReps = 0;
        for (const set of ex.sets) {
          const w = parseFloat(set.weight) || 0, r = parseFloat(set.reps) || 0;
          if (w > mx) { mx = w; mxReps = r; }
        }
        if (mx > 0) {
          map[key].history.push({ date: session.date, weight: mx });
          if (mx > map[key].best) { map[key].best = mx; map[key].bestReps = mxReps; }
        }
      }
    }
    return map;
  }, [logs]);

  const totalSessions = logs.length;
  const last7 = logs.filter(l => Date.now() - new Date(l.date).getTime() < 7 * 24 * 3600 * 1000).length;

  if (loading) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-dim)", fontSize: 14 }}>Завантаження…</div>;
  }

  return (
    <div style={{ minHeight: "100vh" }}>
      <div style={{ borderBottom: "1px solid var(--border)", padding: "18px 16px 0" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <span style={{ fontSize: 20 }}>🏋️</span>
          <h1 className="oswald" style={{ fontSize: 19, fontWeight: 600, margin: 0 }}>Журнал тренувань</h1>
        </div>
        <div style={{ display: "flex", gap: 2, overflowX: "auto", marginBottom: -1 }}>
          <TabBtn active={tab === "plan"} onClick={() => setTab("plan")}>Мій план</TabBtn>
          <TabBtn active={tab === "train"} onClick={() => setTab("train")}>Тренування{activeSession ? " •" : ""}</TabBtn>
          <TabBtn active={tab === "progress"} onClick={() => setTab("progress")}>Прогрес</TabBtn>
        </div>
      </div>

      <div style={{ padding: "18px 16px", maxWidth: 560, margin: "0 auto" }}>
        {note && <div style={{ marginBottom: 14, fontSize: 13, color: "var(--success)" }}>✓ {note}</div>}
        {tab === "plan" && (
          <PlanTab plan={plan} openDayId={openDayId} setOpenDayId={setOpenDayId}
            addDay={addDay} removeDay={removeDay} renameDay={renameDay}
            addExercise={addExercise} updateExercise={updateExercise} removeExercise={removeExercise} />
        )}
        {tab === "train" && (
          <TrainTab plan={plan} activeSession={activeSession} startSession={startSession}
            cancelSession={cancelSession} finishSession={finishSession} updateSet={updateSet}
            addSet={addSet} removeSet={removeSet} toggleSetDone={toggleSetDone} goToPlan={() => setTab("plan")} />
        )}
        {tab === "progress" && (
          <ProgressTab logs={logs} openLogId={openLogId} setOpenLogId={setOpenLogId}
            deleteLog={deleteLog} exerciseStats={exerciseStats} totalSessions={totalSessions} last7={last7} />
        )}
      </div>
    </div>
  );
}

function PlanTab({ plan, openDayId, setOpenDayId, addDay, removeDay, renameDay, addExercise, updateExercise, removeExercise }) {
  return (
    <div>
      {plan.length === 0 && (
        <div style={{ border: "1px dashed var(--border)", borderRadius: 6, padding: 24, textAlign: "center", color: "var(--text-dim)", fontSize: 13, marginBottom: 16 }}>
          Тут поки що порожньо. Додайте перший день тренувань — наприклад «Груди/Трицепс» чи «Ноги».
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {plan.map(day => {
          const isOpen = openDayId === day.id;
          return (
            <div key={day.id} style={{ border: "1px solid var(--border)", borderRadius: 6 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px" }}>
                <button onClick={() => setOpenDayId(isOpen ? null : day.id)} style={{ background: "none", border: "none", color: "var(--text-dim)" }}>
                  {isOpen ? "▾" : "▸"}
                </button>
                <input value={day.name} onChange={e => renameDay(day.id, e.target.value)}
                  style={{ background: "none", border: "none", outline: "none", flex: 1, fontSize: 14, fontWeight: 500 }} placeholder="Назва дня" />
                <span className="tabular" style={{ fontSize: 11, color: "#5c5d63" }}>{day.exercises.length} вправ</span>
                <IconBtn tone="danger" title="Видалити день" onClick={() => removeDay(day.id)}>✕</IconBtn>
              </div>
              {isOpen && (
                <div style={{ borderTop: "1px solid var(--border)", padding: "10px 12px", display: "flex", flexDirection: "column", gap: 8 }}>
                  {day.exercises.map(ex => (
                    <div key={ex.id} style={{ display: "grid", gridTemplateColumns: "5fr 2fr 2fr 2fr auto", gap: 6, alignItems: "center", background: "rgba(255,255,255,0.03)", borderRadius: 4, padding: "6px 8px" }}>
                      <input value={ex.name} onChange={e => updateExercise(day.id, ex.id, "name", e.target.value)} placeholder="Назва вправи"
                        style={{ background: "none", border: "none", outline: "none", fontSize: 13 }} />
                      <input value={ex.targetSets} onChange={e => updateExercise(day.id, ex.id, "targetSets", e.target.value.replace(/\D/g, ""))} placeholder="сети"
                        className="tabular" style={{ background: "none", border: "none", outline: "none", fontSize: 13, textAlign: "center" }} />
                      <input value={ex.targetReps} onChange={e => updateExercise(day.id, ex.id, "targetReps", e.target.value)} placeholder="повт."
                        style={{ background: "none", border: "none", outline: "none", fontSize: 13, textAlign: "center" }} />
                      <input value={ex.targetWeight} onChange={e => updateExercise(day.id, ex.id, "targetWeight", e.target.value.replace(/[^0-9.]/g, ""))} placeholder="кг"
                        className="tabular" style={{ background: "none", border: "none", outline: "none", fontSize: 13, textAlign: "center" }} />
                      <IconBtn tone="danger" title="Видалити вправу" onClick={() => removeExercise(day.id, ex.id)}>✕</IconBtn>
                    </div>
                  ))}
                  <div style={{ display: "grid", gridTemplateColumns: "5fr 2fr 2fr 2fr auto", gap: 6, fontSize: 10, color: "#5c5d63", padding: "0 8px" }}>
                    <span></span><span style={{ textAlign: "center" }}>сети</span><span style={{ textAlign: "center" }}>повтори</span><span style={{ textAlign: "center" }}>кг (ціль)</span><span></span>
                  </div>
                  <button onClick={() => addExercise(day.id)} style={{ background: "none", border: "none", color: "var(--accent)", fontSize: 13, display: "flex", alignItems: "center", gap: 6, padding: "4px 0" }}>
                    + Додати вправу
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <button onClick={addDay} style={{ marginTop: 16, width: "100%", border: "1px solid var(--border)", background: "none", color: "var(--text)", borderRadius: 6, padding: "10px", fontSize: 13 }}>
        + Додати день тренувань
      </button>
    </div>
  );
}

function TrainTab({ plan, activeSession, startSession, cancelSession, finishSession, updateSet, addSet, removeSet, toggleSetDone, goToPlan }) {
  if (!activeSession) {
    return (
      <div>
        {plan.length === 0 ? (
          <div style={{ border: "1px dashed var(--border)", borderRadius: 6, padding: 24, textAlign: "center", color: "var(--text-dim)", fontSize: 13 }}>
            Спочатку створіть план тренувань.
            <button onClick={goToPlan} style={{ display: "block", margin: "8px auto 0", background: "none", border: "none", color: "var(--accent)", fontSize: 13 }}>Перейти до плану →</button>
          </div>
        ) : (
          <>
            <p style={{ fontSize: 13, color: "var(--text-dim)", marginBottom: 12 }}>Оберіть день, щоб почати тренування:</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {plan.map(day => (
                <button key={day.id} onClick={() => startSession(day)} style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between", border: "1px solid var(--border)",
                  background: "none", color: "var(--text)", borderRadius: 6, padding: "12px", textAlign: "left"
                }}>
                  <span>
                    <span style={{ display: "block", fontSize: 14, fontWeight: 500 }}>{day.name}</span>
                    <span style={{ display: "block", fontSize: 12, color: "var(--text-dim)" }}>{day.exercises.length} вправ</span>
                  </span>
                  <span style={{ color: "var(--accent)" }}>▶</span>
                </button>
              ))}
            </div>
          </>
        )}
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
        <div>
          <h2 className="oswald" style={{ fontSize: 16, fontWeight: 600, margin: 0 }}>{activeSession.dayName}</h2>
          <p style={{ fontSize: 12, color: "var(--text-dim)", margin: "2px 0 0" }}>{formatDate(activeSession.date)}</p>
        </div>
        <button onClick={cancelSession} style={{ background: "none", border: "none", color: "var(--text-dim)", fontSize: 12 }}>Скасувати</button>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {activeSession.exercises.map((ex, exIdx) => (
          <div key={ex.exerciseId} style={{ border: "1px solid var(--border)", borderRadius: 6, padding: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
              <h3 style={{ fontSize: 14, fontWeight: 500, margin: 0 }}>{ex.name}</h3>
              <span className="tabular" style={{ fontSize: 11, color: "#5c5d63" }}>ціль: {ex.targetReps}{ex.targetWeight ? ` · ${ex.targetWeight}кг` : ""}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 4fr 4fr 3fr", gap: 6, fontSize: 10, color: "#5c5d63", padding: "0 4px" }}>
                <span>#</span><span>кг</span><span>повт.</span><span></span>
              </div>
              {ex.sets.map((set, setIdx) => (
                <div key={setIdx} style={{
                  display: "grid", gridTemplateColumns: "1fr 4fr 4fr 3fr", gap: 6, alignItems: "center",
                  borderRadius: 4, padding: "6px 4px", background: set.completed ? "rgba(16,185,129,0.12)" : "rgba(255,255,255,0.03)"
                }}>
                  <span className="tabular" style={{ fontSize: 12, color: "var(--text-dim)" }}>{setIdx + 1}</span>
                  <input value={set.weight} onChange={e => updateSet(exIdx, setIdx, "weight", e.target.value.replace(/[^0-9.]/g, ""))}
                    inputMode="decimal" className="tabular"
                    style={{ background: "none", border: "none", borderBottom: "1px solid var(--border)", outline: "none", fontSize: 13, color: "inherit" }} />
                  <input value={set.reps} onChange={e => updateSet(exIdx, setIdx, "reps", e.target.value.replace(/[^0-9]/g, ""))}
                    inputMode="numeric" className="tabular"
                    style={{ background: "none", border: "none", borderBottom: "1px solid var(--border)", outline: "none", fontSize: 13, color: "inherit" }} />
                  <div style={{ display: "flex", justifyContent: "flex-end", gap: 2 }}>
                    <IconBtn tone={set.completed ? "accent" : undefined} title="Виконано" onClick={() => toggleSetDone(exIdx, setIdx)}>✓</IconBtn>
                    <IconBtn tone="danger" title="Видалити сет" onClick={() => removeSet(exIdx, setIdx)}>✕</IconBtn>
                  </div>
                </div>
              ))}
            </div>
            <button onClick={() => addSet(exIdx)} style={{ marginTop: 8, background: "none", border: "none", color: "var(--accent)", fontSize: 12 }}>+ Додати сет</button>
          </div>
        ))}
      </div>
      <button onClick={finishSession} style={{ marginTop: 18, width: "100%", background: "var(--accent)", color: "#fff", border: "none", borderRadius: 6, padding: "12px", fontSize: 14, fontWeight: 500 }}>
        ■ Завершити тренування
      </button>
    </div>
  );
}

function ProgressTab({ logs, openLogId, setOpenLogId, deleteLog, exerciseStats, totalSessions, last7 }) {
  const statEntries = Object.entries(exerciseStats).filter(([, v]) => v.best > 0);
  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 18 }}>
        <div style={{ border: "1px solid var(--border)", borderRadius: 6, padding: 12 }}>
          <p className="oswald tabular" style={{ fontSize: 24, fontWeight: 600, margin: 0 }}>{totalSessions}</p>
          <p style={{ fontSize: 11, color: "var(--text-dim)", margin: "2px 0 0" }}>всього тренувань</p>
        </div>
        <div style={{ border: "1px solid var(--border)", borderRadius: 6, padding: 12 }}>
          <p className="oswald tabular" style={{ fontSize: 24, fontWeight: 600, margin: 0 }}>{last7}</p>
          <p style={{ fontSize: 11, color: "var(--text-dim)", margin: "2px 0 0" }}>за останні 7 днів</p>
        </div>
      </div>
      {statEntries.length > 0 && (
        <div style={{ marginBottom: 18 }}>
          <h3 style={{ fontSize: 13, fontWeight: 500, marginBottom: 8 }}>📈 Особисті рекорди</h3>
          <div style={{ border: "1px solid var(--border)", borderRadius: 6 }}>
            {statEntries.map(([name, s], i) => (
              <div key={name} style={{ display: "flex", justifyContent: "space-between", padding: "8px 12px", fontSize: 13, borderTop: i ? "1px solid var(--border)" : "none" }}>
                <span>{name}</span>
                <span className="tabular" style={{ color: "var(--text-dim)" }}>{s.best}кг × {s.bestReps}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      <h3 style={{ fontSize: 13, fontWeight: 500, marginBottom: 8 }}>Історія тренувань</h3>
      {logs.length === 0 ? (
        <div style={{ border: "1px dashed var(--border)", borderRadius: 6, padding: 24, textAlign: "center", color: "var(--text-dim)", fontSize: 13 }}>
          Ще немає записаних тренувань. Завершіть перше на вкладці «Тренування».
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {logs.map(session => {
            const isOpen = openLogId === session.id;
            const vol = Math.round(sessionVolume(session));
            return (
              <div key={session.id} style={{ border: "1px solid var(--border)", borderRadius: 6 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px" }}>
                  <button onClick={() => setOpenLogId(isOpen ? null : session.id)} style={{ background: "none", border: "none", color: "var(--text-dim)" }}>
                    {isOpen ? "▾" : "▸"}
                  </button>
                  <div style={{ flex: 1 }}>
                    <p style={{ fontSize: 13, fontWeight: 500, margin: 0 }}>{session.dayName}</p>
                    <p className="tabular" style={{ fontSize: 11, color: "var(--text-dim)", margin: "2px 0 0" }}>{formatDate(session.date)} · об'єм {vol} кг</p>
                  </div>
                  <IconBtn tone="danger" title="Видалити запис" onClick={() => deleteLog(session.id)}>🗑</IconBtn>
                </div>
                {isOpen && (
                  <div style={{ borderTop: "1px solid var(--border)", padding: "10px 12px", display: "flex", flexDirection: "column", gap: 8 }}>
                    {session.exercises.map(ex => (
                      <div key={ex.exerciseId}>
                        <p style={{ fontSize: 12, color: "var(--text-dim)", margin: "0 0 4px" }}>{ex.name}</p>
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                          {ex.sets.map((set, i) => (
                            <span key={i} className="tabular" style={{ fontSize: 12, border: "1px solid var(--border)", borderRadius: 4, padding: "4px 8px" }}>
                              {set.weight || 0}кг × {set.reps || 0}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
