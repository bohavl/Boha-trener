<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Журнал тренувань</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --border: #38383a;
    --text: #f5f5f7;
    --text-dim: #98989d;
    --accent: #0a84ff;
    --danger: #ff453a;
    --success: #32d74b;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }
  input { font-family: inherit; color: inherit; background: none; border: none; outline: none; font-size: 16px; }
  button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; font-size: 16px; }
  ::placeholder { color: #6e6e73; }
  .tabular { font-variant-numeric: tabular-nums; }
  .wrap { padding: 20px 18px 40px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .card-outline { border: 1.5px dashed var(--border); border-radius: var(--radius); }
  .dim { color: var(--text-dim); }
  .row { display: flex; align-items: center; }
  .divider { border-top: 0.5px solid var(--border); }
  .icon-btn { padding: 8px; border-radius: 8px; font-size: 17px; line-height: 1; color: var(--text-dim); }
  .icon-btn.danger { color: var(--danger); }
  .icon-btn.accent { color: var(--accent); }
  .section-label { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-dim); margin: 24px 6px 8px; }
  .section-label:first-child { margin-top: 0; }
  .btn-primary { width: 100%; background: var(--accent); color: #fff; border-radius: var(--radius); padding: 15px; font-size: 17px; font-weight: 600; }
  .btn-secondary { width: 100%; background: var(--surface); color: var(--text); border-radius: var(--radius); padding: 15px; font-size: 16px; font-weight: 500; }
  .segwrap { display: flex; background: var(--surface); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg-btn { flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--text-dim); }
  .seg-btn.active { background: var(--surface2); color: var(--text); }
  .list-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; min-height: 48px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; padding: 12px 8px; border-radius: 12px; background: var(--surface2); font-size: 15px; font-weight: 500; text-align: center; }
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50; display: flex; align-items: flex-end; }
  .sheet { width: 100%; max-height: 82vh; background: var(--surface); border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .sheet-handle { width: 36px; height: 5px; background: var(--border); border-radius: 3px; margin: 0 auto 12px; }
  .search-input { background: var(--surface2); border-radius: 10px; padding: 11px 14px; font-size: 16px; width: 100%; }
</style>
</head>
<body>
<div id="app"><div class="wrap dim" style="font-size:16px;">Завантаження…</div></div>
<script>
(function () {
  "use strict";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  var useCloud = !!(tg && tg.CloudStorage);

  // ---------- storage abstraction ----------
  function csGetItems(keys) {
    return new Promise(function (resolve) {
      if (useCloud) { tg.CloudStorage.getItems(keys, function (err, values) { resolve(err ? {} : (values || {})); }); }
      else { var out = {}; keys.forEach(function (k) { var v = localStorage.getItem(k); if (v !== null) out[k] = v; }); resolve(out); }
    });
  }
  function csSet(key, value) {
    return new Promise(function (resolve) {
      if (useCloud) { tg.CloudStorage.setItem(key, value, function () { resolve(); }); }
      else { localStorage.setItem(key, value); resolve(); }
    });
  }
  function csRemove(key) {
    return new Promise(function (resolve) {
      if (useCloud) { tg.CloudStorage.removeItem(key, function () { resolve(); }); }
      else { localStorage.removeItem(key); resolve(); }
    });
  }

  // ---------- helpers ----------
  function uid() { return Date.now() + "-" + Math.random().toString(36).slice(2, 9); }
  function todayISO() { return new Date().toISOString(); }
  function formatDate(iso) { return new Date(iso).toLocaleDateString("uk-UA", { day: "2-digit", month: "short", year: "numeric" }); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
  function sessionVolume(session) {
    return session.exercises.reduce(function (sum, ex) {
      return sum + ex.sets.reduce(function (s, set) { var w = parseFloat(set.weight) || 0, r = parseFloat(set.reps) || 0; return s + w * r; }, 0);
    }, 0);
  }
  function defaultDay(n) { return { id: uid(), name: "День " + n, exercises: [] }; }

  // ---------- exercise library (curated, common gym exercises grouped by muscle group) ----------
  var EXLIB = {
    "Груди": ["Жим штанги лежачи", "Жим гантелей лежачи", "Жим штанги на похилій лаві", "Жим гантелей на похилій лаві", "Жим у тренажері", "Розведення гантелей лежачи", "Кросовер у блоках", "Пек-дек (баттерфляй)", "Віджимання на брусах", "Віджимання від підлоги", "Пуловер з гантеллю"],
    "Спина": ["Підтягування широким хватом", "Підтягування вузьким хватом", "Тяга штанги в нахилі", "Тяга гантелі в нахилі однією рукою", "Тяга верхнього блоку", "Тяга нижнього блоку", "Становова тяга", "Румунська тяга", "Гіперекстензія", "Т-подібна тяга", "Шраги зі штангою"],
    "Ноги": ["Присідання зі штангою", "Присідання в гак-машині", "Жим ногами в тренажері", "Випади з гантелями", "Румунська тяга на прямих ногах", "Розгинання ніг у тренажері", "Згинання ніг лежачи", "Підйоми на носки стоячи", "Підйоми на носки сидячи", "Болгарські випади"],
    "Плечі": ["Жим штанги стоячи", "Жим гантелей сидячи", "Розведення гантелей в сторони", "Розведення гантелей в нахилі", "Тяга штанги до підборіддя", "Махи в блоці на задню дельту", "Жим Арнольда"],
    "Біцепс": ["Підйом штанги на біцепс", "Підйом гантелей на біцепс", "Молотки (Hammer curls)", "Підйом на біцепс у блоці", "Концентрований підйом", "Підйом на лаві Скотта"],
    "Трицепс": ["Французький жим лежачи", "Розгинання рук у блоці", "Розгинання руки з гантеллю з-за голови", "Жим вузьким хватом", "Відтискання на брусах", "Кік-бек з гантеллю"],
    "Прес": ["Скручування на прес", "Підйом ніг у висі", "Планка", "Косі скручування", "Скручування у кросовері", "Велосипед (bicycle crunch)"],
    "Кардіо": ["Біг на доріжці", "Велотренажер", "Еліптичний тренажер", "Гребний тренажер", "Скакалка", "Степпер"]
  };
  var EXCATS = Object.keys(EXLIB);

  // ---------- data layer (chunked to respect Telegram's 4096-char value limit) ----------
  function loadAll() {
    return csGetItems(["days_index", "log_index", "active_session", "program_name"]).then(function (idx) {
      var dayIds = idx.days_index ? JSON.parse(idx.days_index) : [];
      var logIds = idx.log_index ? JSON.parse(idx.log_index) : [];
      var dayKeys = dayIds.map(function (id) { return "day:" + id; });
      var logKeys = logIds.map(function (id) { return "log:" + id; });
      return Promise.all([
        dayKeys.length ? csGetItems(dayKeys) : Promise.resolve({}),
        logKeys.length ? csGetItems(logKeys) : Promise.resolve({})
      ]).then(function (results) {
        var dayVals = results[0], logVals = results[1];
        var plan = dayIds.map(function (id) { return dayVals["day:" + id] ? JSON.parse(dayVals["day:" + id]) : null; }).filter(Boolean);
        var logs = logIds.map(function (id) { return logVals["log:" + id] ? JSON.parse(logVals["log:" + id]) : null; }).filter(Boolean);
        var activeSession = null;
        if (idx.active_session) { try { activeSession = JSON.parse(idx.active_session); } catch (e) {} }
        return { plan: plan, logs: logs, activeSession: activeSession, programName: idx.program_name || "" };
      });
    });
  }
  function saveDaysIndex(plan) { return csSet("days_index", JSON.stringify(plan.map(function (d) { return d.id; }))); }
  function saveDay(day) { return csSet("day:" + day.id, JSON.stringify(day)); }
  function deleteDay(id) { return csRemove("day:" + id); }
  function saveLogsIndex(logs) { return csSet("log_index", JSON.stringify(logs.map(function (l) { return l.id; }))); }
  function saveLog(session) { return csSet("log:" + session.id, JSON.stringify(session)); }
  function deleteLogEntry(id) { return csRemove("log:" + id); }
  function persistSession(s) { return csSet("active_session", JSON.stringify(s || null)); }
  function saveProgramName(name) { return csSet("program_name", name); }

  // ---------- state ----------
  var S = { tab: "plan", plan: [], logs: [], activeSession: null, openDayId: null, openLogId: null, note: "", programName: "", picker: null };
  var dayTimers = {};
  var sessionTimer = null;
  var nameTimer = null;

  var root = document.getElementById("app");

  // ================= RENDER =================
  function render() {
    var html = "";
    html += '<div style="padding:22px 18px 14px;">';
    html += '<h1 style="font-size:28px;font-weight:700;letter-spacing:-0.02em;margin:0 0 16px;">Журнал тренувань</h1>';
    html += '<div class="segwrap">';
    ["plan", "train", "progress"].forEach(function (t) {
      var label = t === "plan" ? "План" : t === "train" ? ("Тренування" + (S.activeSession ? " •" : "")) : "Прогрес";
      html += '<button class="seg-btn' + (S.tab === t ? ' active' : '') + '" onclick="App.setTab(\'' + t + '\')">' + label + '</button>';
    });
    html += '</div></div>';
    html += '<div class="wrap" style="padding-top:0;">';
    if (S.note) html += '<div style="margin-bottom:16px;font-size:15px;color:var(--success);font-weight:500;">✓ ' + esc(S.note) + '</div>';
    if (S.tab === "plan") html += renderPlan();
    else if (S.tab === "train") html += renderTrain();
    else html += renderProgress();
    html += '</div>';
    if (S.picker) html += renderPickerSheet();
    root.innerHTML = html;
  }

  function flash(msg) { S.note = msg; render(); setTimeout(function () { S.note = ""; render(); }, 1800); }

  // ---------- PLAN ----------
  function renderPlan() {
    var html = "";
    html += '<div class="section-label">Назва програми</div>';
    html += '<div class="card" style="padding:2px 16px;">';
    html += '<input value="' + esc(S.programName) + '" placeholder="напр. Push Pull Legs" oninput="App.setProgramName(this.value)" style="width:100%;padding:14px 0;font-size:17px;font-weight:600;">';
    html += '</div>';

    html += '<div class="section-label">Дні тренувань</div>';
    if (S.plan.length === 0) {
      html += '<div class="card-outline" style="padding:28px 20px;text-align:center;font-size:15px;color:var(--text-dim);">Тут поки що порожньо.<br>Додайте перший день — наприклад «Груди/Трицепс» чи «Ноги».</div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:12px;">';
      S.plan.forEach(function (day) {
        var isOpen = S.openDayId === day.id;
        html += '<div class="card">';
        html += '<div class="list-row">';
        html += '<button style="color:var(--text-dim);font-size:15px;" onclick="App.toggleDay(\'' + day.id + '\')">' + (isOpen ? '▾' : '▸') + '</button>';
        html += '<input value="' + esc(day.name) + '" placeholder="Назва дня" oninput="App.renameDay(\'' + day.id + '\', this.value)" style="flex:1;font-size:17px;font-weight:600;">';
        html += '<span class="tabular dim" style="font-size:14px;">' + day.exercises.length + '</span>';
        html += '<button class="icon-btn danger" title="Видалити день" onclick="App.removeDay(\'' + day.id + '\')">✕</button>';
        html += '</div>';
        if (isOpen) {
          html += '<div class="divider" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px;">';
          day.exercises.forEach(function (ex) {
            html += '<div class="card" style="background:var(--surface2);padding:10px 12px;">';
            html += '<input value="' + esc(ex.name) + '" placeholder="Назва вправи" oninput="App.updateExercise(\'' + day.id + '\',\'' + ex.id + '\',\'name\',this.value)" style="width:100%;font-size:16px;font-weight:600;margin-bottom:8px;">';
            html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;">';
            html += '<div><input value="' + esc(ex.targetSets) + '" placeholder="3" inputmode="numeric" oninput="this.value=this.value.replace(/\\D/g,\'\');App.updateExercise(\'' + day.id + '\',\'' + ex.id + '\',\'targetSets\',this.value)" class="tabular" style="width:100%;font-size:16px;text-align:center;background:var(--surface);border-radius:8px;padding:8px 0;"><div style="font-size:11px;color:var(--text-dim);text-align:center;margin-top:2px;">сети</div></div>';
            html += '<div><input value="' + esc(ex.targetReps) + '" placeholder="8-10" oninput="App.updateExercise(\'' + day.id + '\',\'' + ex.id + '\',\'targetReps\',this.value)" style="width:100%;font-size:16px;text-align:center;background:var(--surface);border-radius:8px;padding:8px 0;"><div style="font-size:11px;color:var(--text-dim);text-align:center;margin-top:2px;">повтори</div></div>';
            html += '<div><input value="' + esc(ex.targetWeight) + '" placeholder="кг" inputmode="decimal" oninput="this.value=this.value.replace(/[^0-9.]/g,\'\');App.updateExercise(\'' + day.id + '\',\'' + ex.id + '\',\'targetWeight\',this.value)" class="tabular" style="width:100%;font-size:16px;text-align:center;background:var(--surface);border-radius:8px;padding:8px 0;"><div style="font-size:11px;color:var(--text-dim);text-align:center;margin-top:2px;">кг</div></div>';
            html += '<button class="icon-btn danger" title="Видалити" onclick="App.removeExercise(\'' + day.id + '\',\'' + ex.id + '\')">✕</button>';
            html += '</div></div>';
          });
          html += '<button class="btn-secondary" style="padding:13px;font-size:15px;" onclick="App.openPicker(\'' + day.id + '\')">+ Обрати вправу</button>';
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }
    html += '<button class="btn-secondary" style="margin-top:16px;" onclick="App.addDay()">+ Додати день тренувань</button>';
    return html;
  }

  // ---------- EXERCISE PICKER ----------
  function renderPickerSheet() {
    var html = '<div class="sheet-overlay" onclick="if(event.target===this)App.closePicker()">';
    html += '<div class="sheet">';
    html += '<div class="sheet-handle"></div>';
    html += '<div class="row" style="justify-content:space-between;margin-bottom:14px;">';
    html += '<h2 style="font-size:20px;font-weight:700;margin:0;">Обрати вправу</h2>';
    html += '<button class="icon-btn" onclick="App.closePicker()">✕</button></div>';
    html += '<input id="pickerSearchInput" class="search-input" placeholder="Пошук вправи..." oninput="App.pickerFilter(this.value)">';
    html += '<div id="pickerResults" style="overflow-y:auto;margin-top:14px;flex:1;">' + renderPickerCategories() + '</div>';
    html += '</div></div>';
    return html;
  }
  function renderPickerCategories() {
    var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
    EXCATS.forEach(function (cat) {
      html += '<button class="chip" onclick="App.pickerShowCategory(\'' + cat + '\')">' + esc(cat) + '</button>';
    });
    html += '</div>';
    return html;
  }
  function renderPickerCategoryList(cat) {
    var html = '<button style="color:var(--accent);font-size:15px;margin-bottom:10px;" onclick="App.pickerBack()">‹ Усі категорії</button>';
    html += '<div class="card">';
    (EXLIB[cat] || []).forEach(function (name, i) {
      html += '<button class="list-row' + (i ? ' divider' : '') + '" style="width:100%;text-align:left;font-size:16px;" onclick="App.pickerSelect(\'' + esc(name).replace(/'/g, "\\'") + '\')">' + esc(name) + '</button>';
    });
    html += '</div>';
    return html;
  }
  function renderPickerSearchResults(query) {
    var q = query.trim().toLowerCase();
    var all = [];
    EXCATS.forEach(function (cat) { EXLIB[cat].forEach(function (name) { all.push(name); }); });
    var matches = all.filter(function (name) { return name.toLowerCase().indexOf(q) !== -1; });
    var html = "";
    var exact = all.some(function (n) { return n.toLowerCase() === q; });
    if (!exact) {
      html += '<button class="card" style="width:100%;text-align:left;padding:14px 16px;font-size:16px;color:var(--accent);font-weight:600;margin-bottom:8px;" onclick="App.pickerSelect(\'' + esc(query).replace(/'/g, "\\'") + '\')">+ Додати «' + esc(query) + '» як нову вправу</button>';
    }
    if (matches.length) {
      html += '<div class="card">';
      matches.forEach(function (name, i) {
        html += '<button class="list-row' + (i ? ' divider' : '') + '" style="width:100%;text-align:left;font-size:16px;" onclick="App.pickerSelect(\'' + esc(name).replace(/'/g, "\\'") + '\')">' + esc(name) + '</button>';
      });
      html += '</div>';
    }
    return html;
  }

  // ---------- TRAIN ----------
  function renderTrain() {
    var html = "";
    if (!S.activeSession) {
      if (S.plan.length === 0) {
        html += '<div class="card-outline" style="padding:28px 20px;text-align:center;font-size:15px;color:var(--text-dim);">Спочатку створіть план тренувань.';
        html += '<button style="display:block;margin:10px auto 0;color:var(--accent);font-size:16px;font-weight:600;" onclick="App.setTab(\'plan\')">Перейти до плану →</button></div>';
      } else {
        html += '<div class="section-label">Оберіть день</div>';
        html += '<div style="display:flex;flex-direction:column;gap:10px;">';
        S.plan.forEach(function (day) {
          html += '<button class="card list-row" style="width:100%;justify-content:space-between;text-align:left;padding:16px;" onclick="App.startSession(\'' + day.id + '\')">';
          html += '<span><span style="display:block;font-size:17px;font-weight:600;">' + esc(day.name) + '</span><span style="display:block;font-size:14px;color:var(--text-dim);margin-top:2px;">' + day.exercises.length + ' вправ</span></span>';
          html += '<span style="color:var(--accent);font-size:20px;">▶</span></button>';
        });
        html += '</div>';
      }
      return html;
    }
    var s = S.activeSession;
    html += '<div class="row" style="justify-content:space-between;margin-bottom:18px;">';
    html += '<div><h2 style="font-size:22px;font-weight:700;margin:0;">' + esc(s.dayName) + '</h2><p style="font-size:14px;color:var(--text-dim);margin:2px 0 0;">' + formatDate(s.date) + '</p></div>';
    html += '<button style="color:var(--text-dim);font-size:15px;" onclick="App.cancelSession()">Скасувати</button></div>';
    html += '<div style="display:flex;flex-direction:column;gap:16px;">';
    s.exercises.forEach(function (ex, exIdx) {
      html += '<div class="card" style="padding:14px;">';
      html += '<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:10px;">';
      html += '<h3 style="font-size:17px;font-weight:600;margin:0;">' + esc(ex.name) + '</h3>';
      html += '<span class="tabular dim" style="font-size:13px;">ціль: ' + esc(ex.targetReps) + (ex.targetWeight ? (' · ' + esc(ex.targetWeight) + 'кг') : '') + '</span></div>';
      html += '<div style="display:flex;flex-direction:column;gap:8px;">';
      html += '<div style="display:grid;grid-template-columns:1fr 4fr 4fr 3fr;gap:8px;font-size:12px;color:var(--text-dim);padding:0 4px;"><span>#</span><span>кг</span><span>повт.</span><span></span></div>';
      ex.sets.forEach(function (set, setIdx) {
        html += '<div style="display:grid;grid-template-columns:1fr 4fr 4fr 3fr;gap:8px;align-items:center;border-radius:10px;padding:8px 6px;background:' + (set.completed ? 'rgba(50,215,75,0.15)' : 'var(--surface2)') + ';">';
        html += '<span class="tabular dim" style="font-size:14px;">' + (setIdx + 1) + '</span>';
        html += '<input value="' + esc(set.weight) + '" inputmode="decimal" oninput="this.value=this.value.replace(/[^0-9.]/g,\'\');App.updateSet(' + exIdx + ',' + setIdx + ',\'weight\',this.value)" class="tabular" style="font-size:17px;font-weight:600;background:none;border-bottom:1.5px solid var(--border);width:100%;">';
        html += '<input value="' + esc(set.reps) + '" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,\'\');App.updateSet(' + exIdx + ',' + setIdx + ',\'reps\',this.value)" class="tabular" style="font-size:17px;font-weight:600;background:none;border-bottom:1.5px solid var(--border);width:100%;">';
        html += '<div class="row" style="justify-content:flex-end;gap:2px;">';
        html += '<button class="icon-btn' + (set.completed ? ' accent' : '') + '" title="Виконано" onclick="App.toggleSetDone(' + exIdx + ',' + setIdx + ')">✓</button>';
        html += '<button class="icon-btn danger" title="Видалити сет" onclick="App.removeSet(' + exIdx + ',' + setIdx + ')">✕</button>';
        html += '</div></div>';
      });
      html += '</div>';
      html += '<button style="margin-top:10px;color:var(--accent);font-size:15px;font-weight:500;" onclick="App.addSet(' + exIdx + ')">+ Додати сет</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<button class="btn-primary" style="margin-top:20px;" onclick="App.finishSession()">■ Завершити тренування</button>';
    return html;
  }

  // ---------- PROGRESS ----------
  function computeStats() {
    var map = {};
    S.logs.forEach(function (session) {
      session.exercises.forEach(function (ex) {
        var key = ex.name;
        if (!map[key]) map[key] = { best: 0, bestReps: 0 };
        var mx = 0, mxReps = 0;
        ex.sets.forEach(function (set) { var w = parseFloat(set.weight) || 0, r = parseFloat(set.reps) || 0; if (w > mx) { mx = w; mxReps = r; } });
        if (mx > map[key].best) { map[key].best = mx; map[key].bestReps = mxReps; }
      });
    });
    return map;
  }
  function renderProgress() {
    var stats = computeStats();
    var statEntries = Object.keys(stats).filter(function (k) { return stats[k].best > 0; });
    var totalSessions = S.logs.length;
    var last7 = S.logs.filter(function (l) { return Date.now() - new Date(l.date).getTime() < 7 * 24 * 3600 * 1000; }).length;
    var html = "";
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;">';
    html += '<div class="card" style="padding:16px;"><p class="tabular" style="font-size:32px;font-weight:700;margin:0;">' + totalSessions + '</p><p style="font-size:13px;color:var(--text-dim);margin:4px 0 0;">всього тренувань</p></div>';
    html += '<div class="card" style="padding:16px;"><p class="tabular" style="font-size:32px;font-weight:700;margin:0;">' + last7 + '</p><p style="font-size:13px;color:var(--text-dim);margin:4px 0 0;">за останні 7 днів</p></div>';
    html += '</div>';
    if (statEntries.length > 0) {
      html += '<div class="section-label">Особисті рекорди</div><div class="card">';
      statEntries.forEach(function (name, i) {
        html += '<div class="list-row' + (i ? ' divider' : '') + '" style="justify-content:space-between;"><span style="font-size:16px;">' + esc(name) + '</span><span class="tabular dim" style="font-size:16px;font-weight:600;">' + stats[name].best + 'кг × ' + stats[name].bestReps + '</span></div>';
      });
      html += '</div>';
    }
    html += '<div class="section-label">Історія тренувань</div>';
    if (S.logs.length === 0) {
      html += '<div class="card-outline" style="padding:28px 20px;text-align:center;font-size:15px;color:var(--text-dim);">Ще немає записаних тренувань.</div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:10px;">';
      S.logs.forEach(function (session) {
        var isOpen = S.openLogId === session.id;
        var vol = Math.round(sessionVolume(session));
        html += '<div class="card">';
        html += '<div class="list-row">';
        html += '<button style="color:var(--text-dim);" onclick="App.toggleLog(\'' + session.id + '\')">' + (isOpen ? '▾' : '▸') + '</button>';
        html += '<div style="flex:1;"><p style="font-size:16px;font-weight:600;margin:0;">' + esc(session.dayName) + '</p><p class="tabular" style="font-size:13px;color:var(--text-dim);margin:2px 0 0;">' + formatDate(session.date) + " · об'єм " + vol + ' кг</p></div>';
        html += '<button class="icon-btn danger" title="Видалити" onclick="App.deleteLog(\'' + session.id + '\')">🗑</button></div>';
        if (isOpen) {
          html += '<div class="divider" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px;">';
          session.exercises.forEach(function (ex) {
            html += '<div><p style="font-size:14px;color:var(--text-dim);margin:0 0 6px;font-weight:500;">' + esc(ex.name) + '</p><div style="display:flex;flex-wrap:wrap;gap:8px;">';
            ex.sets.forEach(function (set) { html += '<span class="tabular" style="font-size:14px;background:var(--surface2);border-radius:8px;padding:6px 10px;">' + (set.weight || 0) + 'кг × ' + (set.reps || 0) + '</span>'; });
            html += '</div></div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }
    return html;
  }

  // ================= ACTIONS =================
  var App = {
    setTab: function (t) { S.tab = t; render(); },
    setProgramName: function (val) { S.programName = val; clearTimeout(nameTimer); nameTimer = setTimeout(function () { saveProgramName(val); }, 500); },

    addDay: function () {
      var day = defaultDay(S.plan.length + 1);
      S.plan.push(day); S.openDayId = day.id;
      render();
      saveDaysIndex(S.plan); saveDay(day);
    },
    removeDay: function (id) {
      if (!window.confirm("Видалити цей день тренувань разом з усіма вправами?")) return;
      S.plan = S.plan.filter(function (d) { return d.id !== id; });
      render();
      saveDaysIndex(S.plan); deleteDay(id);
    },
    toggleDay: function (id) { S.openDayId = S.openDayId === id ? null : id; render(); },
    renameDay: function (id, name) {
      var day = S.plan.find(function (d) { return d.id === id; });
      if (!day) return;
      day.name = name;
      clearTimeout(dayTimers[id]);
      dayTimers[id] = setTimeout(function () { saveDay(day); }, 500);
    },
    updateExercise: function (dayId, exId, field, value) {
      var day = S.plan.find(function (d) { return d.id === dayId; });
      if (!day) return;
      var ex = day.exercises.find(function (e) { return e.id === exId; });
      if (!ex) return;
      ex[field] = value;
      clearTimeout(dayTimers[dayId]);
      dayTimers[dayId] = setTimeout(function () { saveDay(day); }, 500);
    },
    removeExercise: function (dayId, exId) {
      var day = S.plan.find(function (d) { return d.id === dayId; });
      if (!day) return;
      day.exercises = day.exercises.filter(function (e) { return e.id !== exId; });
      render();
      saveDay(day);
    },

    // picker
    openPicker: function (dayId) { S.picker = { dayId: dayId }; render(); },
    closePicker: function () { S.picker = null; render(); },
    pickerFilter: function (value) {
      var el = document.getElementById("pickerResults");
      if (!el) return;
      var q = value.trim();
      el.innerHTML = q ? renderPickerSearchResults(q) : renderPickerCategories();
    },
    pickerShowCategory: function (cat) {
      var el = document.getElementById("pickerResults");
      if (el) el.innerHTML = renderPickerCategoryList(cat);
    },
    pickerBack: function () {
      var el = document.getElementById("pickerResults");
      if (el) el.innerHTML = renderPickerCategories();
    },
    pickerSelect: function (name) {
      if (!S.picker) return;
      var day = S.plan.find(function (d) { return d.id === S.picker.dayId; });
      if (!day) { S.picker = null; render(); return; }
      day.exercises.push({ id: uid(), name: name, targetSets: 3, targetReps: "8-12", targetWeight: "" });
      S.picker = null;
      render();
      saveDay(day);
    },

    // session
    startSession: function (dayId) {
      var day = S.plan.find(function (d) { return d.id === dayId; });
      if (!day) return;
      var session = {
        id: uid(), dayId: day.id, dayName: day.name, date: todayISO(),
        exercises: day.exercises.map(function (ex) {
          var n = Math.max(1, parseInt(ex.targetSets) || 1);
          var sets = [];
          for (var i = 0; i < n; i++) sets.push({ weight: ex.targetWeight || "", reps: "", completed: false });
          return { exerciseId: ex.id, name: ex.name || "Вправа", targetReps: ex.targetReps, targetWeight: ex.targetWeight, sets: sets };
        })
      };
      S.activeSession = session;
      render();
      persistSession(session);
    },
    cancelSession: function () {
      if (!window.confirm("Скасувати поточне тренування? Незбережений прогрес буде втрачено.")) return;
      S.activeSession = null;
      render();
      persistSession(null);
    },
    finishSession: function () {
      if (!S.activeSession) return;
      var cleaned = JSON.parse(JSON.stringify(S.activeSession));
      cleaned.exercises.forEach(function (ex) { ex.sets = ex.sets.filter(function (s) { return s.weight !== "" || s.reps !== ""; }); });
      S.logs.unshift(cleaned);
      S.activeSession = null;
      S.tab = "progress";
      render();
      saveLog(cleaned); saveLogsIndex(S.logs); persistSession(null);
      flash("Тренування збережено");
    },
    updateSet: function (exIdx, setIdx, field, value) {
      if (!S.activeSession) return;
      S.activeSession.exercises[exIdx].sets[setIdx][field] = value;
      clearTimeout(sessionTimer);
      sessionTimer = setTimeout(function () { persistSession(S.activeSession); }, 400);
    },
    addSet: function (exIdx) {
      if (!S.activeSession) return;
      S.activeSession.exercises[exIdx].sets.push({ weight: "", reps: "", completed: false });
      render();
      persistSession(S.activeSession);
    },
    removeSet: function (exIdx, setIdx) {
      if (!S.activeSession) return;
      S.activeSession.exercises[exIdx].sets.splice(setIdx, 1);
      render();
      persistSession(S.activeSession);
    },
    toggleSetDone: function (exIdx, setIdx) {
      if (!S.activeSession) return;
      var set = S.activeSession.exercises[exIdx].sets[setIdx];
      set.completed = !set.completed;
      render();
      persistSession(S.activeSession);
    },

    // history
    toggleLog: function (id) { S.openLogId = S.openLogId === id ? null : id; render(); },
    deleteLog: function (id) {
      if (!window.confirm("Видалити цей запис тренування?")) return;
      S.logs = S.logs.filter(function (l) { return l.id !== id; });
      render();
      deleteLogEntry(id); saveLogsIndex(S.logs);
    }
  };
  window.App = App;

  loadAll().then(function (data) {
    S.plan = data.plan; S.logs = data.logs; S.activeSession = data.activeSession; S.programName = data.programName;
    render();
  }).catch(function () { render(); });
})();
</script>
</body>
</html>
