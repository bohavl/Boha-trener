<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Журнал тренувань</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --surface3: #3a3a3c;
    --border: #38383a;
    --text: #f5f5f7;
    --text-dim: #98989d;
    --accent: #0a84ff;
    --danger: #ff453a;
    --success: #32d74b;
    --warn: #ff9f0a;
    --purple: #bf5af2;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }
  input, textarea, select { font-family: inherit; color: inherit; background: none; border: none; outline: none; font-size: 16px; }
  button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; font-size: 16px; }
  ::placeholder { color: #6e6e73; }
  .tabular { font-variant-numeric: tabular-nums; }
  .wrap { padding: 20px 18px 48px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .card-outline { border: 1.5px dashed var(--border); border-radius: var(--radius); }
  .dim { color: var(--text-dim); }
  .row { display: flex; align-items: center; }
  .divider { border-top: 0.5px solid var(--border); }
  .icon-btn { padding: 7px; border-radius: 8px; font-size: 16px; line-height: 1; color: var(--text-dim); }
  .icon-btn.danger { color: var(--danger); }
  .icon-btn.accent { color: var(--accent); }
  .section-label { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-dim); margin: 22px 6px 8px; display:flex; justify-content:space-between; align-items:center; }
  .section-label:first-child { margin-top: 0; }
  .btn-primary { width: 100%; background: var(--accent); color: #fff; border-radius: var(--radius); padding: 15px; font-size: 17px; font-weight: 600; }
  .btn-secondary { width: 100%; background: var(--surface); color: var(--text); border-radius: var(--radius); padding: 15px; font-size: 16px; font-weight: 500; }
  .btn-ghost { color: var(--accent); font-size: 15px; font-weight: 500; }
  .segwrap { display: flex; background: var(--surface); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg-btn { flex: 1 1 auto; text-align: center; padding: 9px 6px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-dim); white-space: nowrap; }
  .btn-primary[disabled] { opacity: .6; }
  .seg-btn.active { background: var(--surface2); color: var(--text); }
  .list-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; min-height: 48px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 12px; background: var(--surface2); font-size: 14px; font-weight: 500; text-align: center; white-space: nowrap; }
  .chip.active { background: var(--accent); color: #fff; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--surface3); color:var(--text-dim); }
  .badge.warn { background: rgba(255,159,10,0.18); color: var(--warn); }
  .badge.purple { background: rgba(191,90,242,0.18); color: var(--purple); }
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50; display: flex; align-items: flex-end; }
  .sheet { width: 100%; max-height: 86vh; background: var(--surface); border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .sheet-handle { width: 36px; height: 5px; background: var(--border); border-radius: 3px; margin: 0 auto 12px; }
  .search-input { background: var(--surface2); border-radius: 10px; padding: 11px 14px; font-size: 16px; width: 100%; }
  .field { background: var(--surface2); border-radius: 10px; padding: 10px 12px; width: 100%; }
  textarea.mono { font-family: ui-monospace, monospace; font-size: 13px; width:100%; min-height:180px; background:var(--surface2); border-radius:10px; padding:12px; }
  .stopwatch { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:13px; position:relative; }
  .cal-dot { position:absolute; bottom:4px; width:5px; height:5px; border-radius:50%; background:var(--accent); }
</style>
</head>

  // ---------- storage abstraction with local mirror (basic offline resilience) ----------

  var CLOUD_TIMEOUT_MS = 4000;

  function csGetItems(keys) {

          resolve(out);

            resolve(out);
          });

            settled = true; clearTimeout(timer);
            var out2 = {};
            keys.forEach(function (k) { var m = mirrorGet(k); if (m !== null) out2[k] = m; });
            resolve(out2);
          }
        }
      } else {
        var out = {};
        keys.forEach(function (k) { var v = localStorage.getItem(k); if (v !== null) out[k] = v; else { var m = mirrorGet(k); if (m !== null) out[k] = m; } });

      }
    });
  }
  function csSet(key, value) {
    mirrorSet(key, value);

        try {
          tg.CloudStorage.setItem(key, value, function () { if (!settled) { settled = true; clearTimeout(timer); resolve(); } });
        } catch (e) { if (!settled) { settled = true; clearTimeout(timer); resolve(); } }
      } else { try { localStorage.setItem(key, value); } catch (e) {} resolve(); }
    });
  }
  function csRemove(key) {
    try { localStorage.removeItem("mirror:" + key); } catch (e) {}

      if (useCloud) {

  function jsStr(s) { return esc(String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'")); }

  function filterByEquip(list) { return S.picker.equip ? list.filter(function (it) { return it.e === S.picker.equip; }) : list; }
  function renderPickerCategories() {
    var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';

      var n = filterByEquip(EXLIB[cat]).length;

  function exItemRow(it, i) {
    var html = '<button class="list-row' + (i ? ' divider' : '') + '" style="width:100%;text-align:left;flex-direction:column;align-items:flex-start;" onclick="App.pickerSelect(\'' + jsStr(it.n) + '\')">';

    html += '</button>';
    return html;
  }
  function renderPickerCategoryList(cat) {
    var html = '<button style="color:var(--accent);font-size:15px;margin-bottom:10px;" onclick="App.pickerBack()">‹ Усі категорії</button>';
    html += '<div class="card">';
    filterByEquip(EXLIB[cat]).forEach(function (it, i) { html += exItemRow(it, i); });
    html += '</div>';
    return html;
  }
  function renderPickerSearchResults(query) {
    var q = query.trim().toLowerCase();
    var matches = filterByEquip(EXFLAT).filter(function (it) { return it.n.toLowerCase().indexOf(q) !== -1; });
    var html = "";
    var exact = EXFLAT.some(function (it) { return it.n.toLowerCase() === q; });
    if (!exact && query.trim()) {
      html += '<button class="card" style="width:100%;text-align:left;padding:14px 16px;font-size:16px;color:var(--accent);font-weight:600;margin-bottom:8px;" onclick="App.pickerSelect(\'' + jsStr(query) + '\')">+ Додати «' + esc(query) + '» як нову вправу</button>';
    }
    if (matches.length) {
      html += '<div class="card">';
      matches.forEach(function (it, i) { html += exItemRow(it, i); });
      html += '</div>';
    }
    return html;
  }
  function altRow(it, i, cur) {
    var html = '<button class="list-row' + (i ? ' divider' : '') + '" style="width:100%;text-align:left;flex-direction:column;align-items:stretch;gap:4px;" onclick="App.pickerSelect(\'' + jsStr(it.n) + '\')">';
    html += '<div class="row" style="justify-content:space-between;gap:8px;"><span style="font-size:16px;font-weight:500;">' + esc(it.n) + (it.c ? ' ⚠️' : '') + '</span><span class="badge">' + esc(it.e) + '</span></div>';
    if (it.pl) html += '<div style="font-size:13px;color:var(--success);">+ ' + esc(it.pl) + '</div>';
    if (it.mn) html += '<div style="font-size:13px;color:var(--danger);">− ' + esc(it.mn) + '</div>';
    if (cur && cur.e !== it.e) html += '<div class="dim" style="font-size:12px;">інше обладнання: ' + esc(cur.e) + ' → ' + esc(it.e) + '</div>';
    html += '</button>';
    return html;
  }
  function renderPickerSubstituteSuggestions(exName) {
    var cur = libFind(exName);
    var html = "";
    if (cur) {
      var same = EXFLAT.filter(function (it) { return it.p === cur.p && it.n !== cur.n; });
      same = filterByEquip(same);
      // different equipment first — when a machine is busy you usually need another tool
      same.sort(function (a, b) { return (a.e === cur.e) - (b.e === cur.e); });
      var related = [];
      (PATTERN_RELATED[cur.p] || []).forEach(function (rp) { EXFLAT.forEach(function (it) { if (it.p === rp) related.push(it); }); });
      related = filterByEquip(related).slice(0, 5);
      html += '<div class="card" style="padding:12px 14px;margin-bottom:6px;"><div class="dim" style="font-size:12px;">Замінюємо</div><div style="font-size:16px;font-weight:600;">' + esc(exName) + '</div><div class="dim" style="font-size:13px;">рух: ' + esc(PATTERN_LABEL[cur.p] || cur.p) + ' · ' + esc(cur.e) + '</div></div>';
      if (same.length) {
        html += '<div class="section-label">Той самий рух — найкраща заміна</div><div class="card">';
        same.forEach(function (it, i) { html += altRow(it, i, cur); });
        html += '</div>';
      }
      if (related.length) {
        html += '<div class="section-label">Схожий рух (якщо все вище зайняте)</div><div class="card">';
        related.forEach(function (it, i) { html += altRow(it, i, cur); });
        html += '</div>';
      }
    } else {
      html += '<p class="dim" style="font-size:14px;margin:0 0 8px;">Цієї вправи немає в базі, тому точні аналоги підібрати не вийде. Знайдіть заміну пошуком або в категоріях:</p>';
    }
    html += '<div class="section-label">Або оберіть будь-яку іншу</div>' + renderPickerCategories();
    return html;
  }

  // ---------- TRAIN ----------
  function prLine(name, statsMap) {
    var st = statsMap[name];
    if (!st || !st.best) return null;
    return st;
  }
  function renderTrain() {
    var html = "";
    if (!S.activeSession) {
      if (S.programs.length === 0 || Object.keys(S.days).length === 0) {
        html += '<div class="card-outline" style="padding:28px 20px;text-align:center;font-size:15px;color:var(--text-dim);">Спочатку створіть план тренувань.';
        html += '<button style="display:block;margin:10px auto 0;color:var(--accent);font-size:16px;font-weight:600;" onclick="App.setTab(\'plan\')">Перейти до плану →</button></div>';
        return html;
      }
      html += renderProgramSwitcher();
      var p = currentProgram();
      var days = daysOfProgram(p);
      var stats = computeStats();
      html += '<div class="section-label">Оберіть день</div>';
      html += '<div style="display:flex;flex-direction:column;gap:10px;">';
      days.forEach(function (day) {
        html += '<button class="card list-row" style="width:100%;justify-content:space-between;text-align:left;padding:16px;" onclick="App.requestStart(\'' + day.id + '\')">';
        html += '<span><span style="display:block;font-size:17px;font-weight:600;">' + esc(day.name) + tagRow(day) + '</span><span style="display:block;font-size:14px;color:var(--text-dim);margin-top:4px;">' + day.exercises.length + ' вправ</span>';
        var hint = "";
        day.exercises.some(function (ex) {
          var st = prLine(ex.name, stats);
          if (st && st.trendUp) { hint = "🔥 Можливий рекорд: " + ex.name; return true; }
          return false;
        });
        if (hint) html += '<span style="display:block;font-size:13px;color:var(--warn);margin-top:4px;">' + esc(hint) + '</span>';
        html += '</span>';
        html += '<span style="color:var(--accent);font-size:20px;">▶</span></button>';
      });
      html += '</div>';
      return html;
    }
    var s = S.activeSession;
    html += '<div class="row" style="justify-content:space-between;margin-bottom:8px;">';
    html += '<div><h2 style="font-size:22px;font-weight:700;margin:0;">' + esc(s.dayName) + '</h2><p style="font-size:14px;color:var(--text-dim);margin:2px 0 0;">' + formatDate(s.date) + '</p></div>';

      html += '<span class="tabular dim" style="font-size:13px;">ціль: ' + esc(ex.targetReps) + (ex.targetWeight ? (' · ' + esc(ex.targetWeight) + 'кг') : '') + '</span></div>';
      html += '<div style="text-align:right;"><div id="timer-' + exIdx + '" class="stopwatch">' + fmtTime(elapsed) + '</div>';
      html += '<button class="btn-ghost" style="font-size:13px;" onclick="App.toggleTimer(' + exIdx + ')">' + (running ? "Стоп" : "Старт") + '</button></div>';
      html += '</div>';

      html += '<div style="display:flex;flex-direction:column;gap:8px;">';
      html += '<div style="display:grid;grid-template-columns:1.4fr 3fr 3fr 2.4fr 3fr;gap:6px;font-size:11px;color:var(--text-dim);padding:0 4px;"><span>#</span><span>кг</span><span>повт.</span><span>RPE</span><span></span></div>';
      ex.sets.forEach(function (set, setIdx) {

        html += '<input value="' + esc(set.reps) + '" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,\'\');App.updateSet(' + exIdx + ',' + setIdx + ',\'reps\',this.value)" class="tabular" style="font-size:16px;font-weight:600;background:none;border-bottom:1.5px solid var(--border);width:100%;">';
        html += '<input value="' + esc(set.rpe) + '" inputmode="numeric" placeholder="-" oninput="this.value=this.value.replace(/[^0-9]/g,\'\');App.updateSet(' + exIdx + ',' + setIdx + ',\'rpe\',this.value)" class="tabular" style="font-size:14px;background:none;border-bottom:1.5px solid var(--border);width:100%;">';

        html += '</div></div>';

  function setTypeLabel(t) {
    return t === "warmup" ? "Розм." : t === "dropset" ? "Дроп" : t === "restpause" ? "R-p." : "Норм";
  }

  // ---------- PROGRESS ----------
  function computeStats() {
    var map = {};
    S.logs.forEach(function (session) {
      session.exercises.forEach(function (ex) {
        var key = ex.name;
        if (!map[key]) map[key] = { best: 0, bestReps: 0, best1rm: 0, history: [] };
        var mx = 0, mxReps = 0, mx1 = 0;
        ex.sets.forEach(function (set) {
          if (set.type === "warmup") return;
          var w = parseFloat(set.weight) || 0, r = parseFloat(set.reps) || 0;
          if (w > mx) { mx = w; mxReps = r; }
          var e1 = est1RM(w, r);
          if (e1 > mx1) mx1 = e1;
        });
        if (mx > 0) {
          map[key].history.push({ date: session.date, weight: mx });
          if (mx > map[key].best) { map[key].best = mx; map[key].bestReps = mxReps; }
          if (mx1 > map[key].best1rm) map[key].best1rm = mx1;
        }
      });
    });
    Object.keys(map).forEach(function (k) {
      var h = map[k].history.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
      if (h.length >= 2) {
        var last = h[h.length - 1].weight, prev = h[h.length - 2].weight;
        map[k].trendUp = last >= prev && last >= map[k].best * 0.95;
      }
    });
    return map;
  }
  // ---------- rule-based insights (local heuristics, no external AI — see note in Progress tab) ----------
  function computeInsights(stats) {
    var out = { stalling: [], progressing: [], neglected: [] };
    Object.keys(stats).forEach(function (name) {
      var h = stats[name].history.slice().sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
      if (h.length >= 3) {
        var lastThree = h.slice(-3).map(function (x) { return x.weight; });
        if (lastThree[2] <= lastThree[0] && lastThree[1] <= lastThree[0]) {
          out.stalling.push(name);
        }
      }
      if (stats[name].trendUp) {
        out.progressing.push({ name: name, next: Math.round((stats[name].best + 2.5) * 2) / 2 });
      }
    });
    // neglected muscle groups: tags present in the plan but with 0 logged volume in the last 14 days
    var usedTags = {};
    S.programs.forEach(function (p) { (p.dayIds || []).forEach(function (id) { var d = S.days[id]; if (d) (d.tags || []).forEach(function (t) { usedTags[t] = true; }); }); });
    var recentTags = {};
    var cutoff = Date.now() - 14 * 24 * 3600 * 1000;
    S.logs.forEach(function (l) { if (new Date(l.date).getTime() >= cutoff) (l.tags || []).forEach(function (t) { recentTags[t] = true; }); });
    Object.keys(usedTags).forEach(function (t) { if (!recentTags[t]) out.neglected.push(t); });
    return out;
  }

  function computeMuscleWeeklySeries(weeksBack) {
    var series = {};
    var now = new Date();
    var weekStarts = [];
    for (var w = weeksBack - 1; w >= 0; w--) {
      var d = new Date(now); d.setDate(d.getDate() - w * 7);
      weekStarts.push(startOfWeek(d));
    }
    S.logs.forEach(function (l) {
      var d = new Date(l.date);
      var vol = sessionVolume(l);
      (l.tags || []).forEach(function (t) {
        if (!series[t]) series[t] = weekStarts.map(function () { return 0; });
        for (var i = weekStarts.length - 1; i >= 0; i--) {
          if (d >= weekStarts[i]) { series[t][i] += vol; break; }
        }
      });
    });
    return series;
  }
  function buildSparkline(vals) {
    vals = vals.filter(function (v) { return v > 0; });
    if (vals.length < 2) return '<p class="dim" style="font-size:12px;">Недостатньо даних для графіка.</p>';
    var w = 280, h = 60, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max) { min -= 1; max += 1; }
    var pts = vals.map(function (v, i) {
      var x = (i / (vals.length - 1)) * (w - 10) + 5;
      var y = h - 8 - ((v - min) / (max - min)) * (h - 16);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:60px;margin-top:8px;"><polyline points="' + pts + '" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  function parseAIJson(text) {
    var t = String(text || "").replace(/```json|```/g, "");
    var a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a === -1 || b === -1) throw new Error("bad json");
    var obj = JSON.parse(t.slice(a, b + 1));
    obj.insights = Array.isArray(obj.insights) ? obj.insights : [];
    obj.changes = Array.isArray(obj.changes) ? obj.changes.slice(0, 12) : [];
    return obj;
  }

  function manageTimerInterval() {

      timerInterval = setInterval(function () {
        if (!S.activeSession) return;

      }, 1000);

  }

    S.activeSession = data.activeSession || null; S.bw = data.bw || [];
    if (!S.currentProgramId || !S.programs.some(function (p) { return p.id === S.currentProgramId; })) {
      S.currentProgramId = S.programs.length ? S.programs[0].id : null;
    }
    render();
  }
  setTimeout(function () { if (!bootDone) { applyLoaded({ programs: [], days: {}, logs: [], activeSession: null, bw: [] }); } }, 15000);
  csGetItems(["ai_settings"]).then(function (r) {
    if (r.ai_settings) { try { var st = JSON.parse(r.ai_settings); if (st && st.apiKey) { S.ai.settings = st; S.ai.draft = JSON.parse(r.ai_settings); if (bootDone) render(); } } catch (e) {} }
  });
  loadAll().then(function (data) {
    return reconcileAll(data).then(function (result) {
      applyLoaded(result.data);
      if (result.changed) { setTimeout(function () { flash("Відновлено елементів зі сховища: " + result.recoveredCount); }, 250); }
    });
  }).catch(function () { applyLoaded({ programs: [], days: {}, logs: [], activeSession: null, bw: [] }); });
})();
</script>
</body>
</html>
